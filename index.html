<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쑤닐의 퇴고장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ui:1;
  --paper:#FAFAF7; --paper-2:#F1F2ED; --paper-3:#E6E8E1;
  --ink:#1F2430; --ink-2:#5B6270; --ink-3:#8A909B;
  --rule:#C3D6CA; --rule-strong:#5E8F72;
  --del:#C4342D; --del-bg:#FBE9E7; --del-line:#E39A95;
  --ins:#2D5BB9; --ins-bg:#E7EEFB; --ins-line:#9DB6EA;
  --memo:#2E7D4F; --memo-bg:#E4F1E8;
  --btn:#1F2430; --btn-ink:#FAFAF7;
  --focus:#2D5BB9;
  --serif:"Noto Serif KR",AppleMyungjo,"Nanum Myeongjo",Batang,serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15181D; --paper-2:#1B1F26; --paper-3:#252A33;
    --ink:#E7E5DE; --ink-2:#A9AEB8; --ink-3:#7C828D;
    --rule:#2E463A; --rule-strong:#6FA98A;
    --del:#F0776E; --del-bg:#3A2321; --del-line:#8C3F3A;
    --ins:#86ACF2; --ins-bg:#1D2A45; --ins-line:#3E5A96;
    --memo:#7FC49A; --memo-bg:#1E3327;
    --btn:#E7E5DE; --btn-ink:#15181D;
    --focus:#86ACF2;
  }
}
:root[data-theme="dark"]{
  --paper:#15181D; --paper-2:#1B1F26; --paper-3:#252A33;
  --ink:#E7E5DE; --ink-2:#A9AEB8; --ink-3:#7C828D;
  --rule:#2E463A; --rule-strong:#6FA98A;
  --del:#F0776E; --del-bg:#3A2321; --del-line:#8C3F3A;
  --ins:#86ACF2; --ins-bg:#1D2A45; --ins-line:#3E5A96;
  --memo:#7FC49A; --memo-bg:#1E3327;
  --btn:#E7E5DE; --btn-ink:#15181D;
  --focus:#86ACF2;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:calc(14px * var(--ui,1));line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--ins)}

/* ── 상단 바 ── */
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;cursor:pointer}
.brand h1{font-family:var(--serif);font-weight:600;font-size:calc(24px * var(--ui,1));margin:0;letter-spacing:.02em}
.brand .sub{color:var(--ink-3);font-size:calc(12px * var(--ui,1))}
.pen{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--del);transform:translateY(-1px)}
.btn{border:1px solid var(--ink-2);background:transparent;border-radius:4px;padding:6px 12px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--del);border-color:var(--del-line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:3px 8px;font-size:calc(12px * var(--ui,1))}

/* ── 본체 ── */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 50px)}
.shell.nrail{grid-template-columns:44px minmax(0,1fr)}
.shell.nrail .rail{padding-block:10px;padding-inline:6px}
.shell.nrail .rail h2{margin:0;justify-content:center}
.shell.nrail .rail .t,.shell.nrail .cases,.shell.nrail .empty{display:none}
.rail h2{display:flex;align-items:center;gap:6px;margin:0 12px 10px}
.rail h2 .fold{margin-left:auto;border:1px solid var(--ink-3);background:var(--paper);cursor:pointer;color:var(--ink-2);font-size:calc(12px * var(--ui,1));letter-spacing:0;text-transform:none;font-weight:500;line-height:1;padding:6px 9px;border-radius:4px;white-space:nowrap}
.rail h2 .fold:hover{background:var(--paper-3);color:var(--ink);border-color:var(--ink)}
.shell.nrail .rail h2 .fold{margin:0;writing-mode:vertical-rl;padding:12px 7px;font-size:calc(12.5px * var(--ui,1));letter-spacing:.06em}
.zoom{display:inline-flex;align-items:center;border:1px solid var(--ink-2);border-radius:4px;overflow:hidden;font-size:calc(12px * var(--ui,1))}
.zoom button{border:0;background:transparent;padding:3px 9px;cursor:pointer;border-right:1px solid var(--ink-2);line-height:1.3}
.zoom button:last-child{border-right:0}
.zoom button:hover{background:var(--paper-2)}
.zoom .z{font-family:var(--mono);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.rail{border-right:1px solid var(--rule);background:var(--paper-2);padding-block:12px;padding-inline:0;position:sticky;top:var(--top-h,50px);left:0;height:calc(100vh - var(--top-h,50px));overflow-y:auto;align-self:start;z-index:4}
.rail h2{font-size:calc(11px * var(--ui,1));letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 16px 8px;font-weight:600}
.cases{list-style:none;margin:0;padding:0}
.cases li{padding:10px 34px 10px 16px;border-left:3px solid transparent;cursor:pointer;position:relative}
.cases li .more{position:absolute;right:8px;top:8px;border:0;background:transparent;color:var(--ink-3);font-size:calc(16px * var(--ui,1));line-height:1;padding:2px 6px;border-radius:3px;cursor:pointer;opacity:0}
.cases li:hover .more,.cases li .more:focus-visible{opacity:1}
.cases li .more:hover{background:var(--paper-3);color:var(--ink)}
.cases li.sel{padding-left:12px;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:start}
.cases li.sel .ck{margin:3px 0 0;grid-row:1/3}
.cases li.sel .t{grid-column:2} .cases li.sel .m{grid-column:2}
.selrow{padding:0 12px 8px;display:flex;justify-content:flex-end}
.selbar{padding:0 12px 8px;display:flex;gap:6px}
.imenu{position:fixed;z-index:30;background:var(--paper);border:1px solid var(--rule);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;flex-direction:column;min-width:140px;padding:4px}
.imenu button{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:3px;cursor:pointer}
.imenu button:hover{background:var(--paper-2)}
.imenu button.d{color:var(--del)}
.cases li:hover{background:var(--paper-3)}
.cases li.on{border-left-color:var(--del);background:var(--paper)}
.cases .t{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cases .m{color:var(--ink-3);font-size:calc(12px * var(--ui,1));display:flex;gap:8px;margin-top:2px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.chip{display:inline-block;font-size:calc(11px * var(--ui,1));padding:1px 6px;border-radius:3px;background:var(--paper-3);color:var(--ink-2);line-height:1.5}
.chip.pdf{background:var(--del-bg);color:var(--del)}
.chip.last{background:var(--ins-bg);color:var(--ins)}
.empty{padding:16px;color:var(--ink-3);font-size:calc(13px * var(--ui,1))}

main{padding-block:0 60px;padding-inline:20px;min-width:0}
body.zoomed-body .top{left:0;width:100vw}
.shell{--rail-w:240px}
.shell.nrail{--rail-w:44px}

/* 배율과 무관하게 항상 왼쪽 정렬(100%일 때만 가운데로 튀지 않게) */
.head,.sheet,.overall,.edit,.mlist{margin-left:0!important;margin-right:0!important}

/* ── 사건 머리 ── */
.head{max-width:none;margin:0 0 18px;position:sticky;top:var(--top-h,50px);z-index:4;background:var(--paper);padding-top:16px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.head .hint{margin-top:8px}
body.zoomed-body .head{left:20px;max-width:calc(100vw - var(--rail-w,240px) - 40px)}
.head .eyebrow{font-size:calc(12px * var(--ui,1));color:var(--ink-3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head h2{font-family:var(--serif);font-size:calc(24px * var(--ui,1));font-weight:600;margin:4px 0 6px;text-wrap:balance;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h2 .hbtns{display:inline-flex;gap:6px;font-family:var(--sans);font-weight:400}
.stats{display:flex;gap:18px;font-family:var(--mono);font-size:calc(12px * var(--ui,1));color:var(--ink-2);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats b{font-weight:500;color:var(--ink)}
.stats .d b{color:var(--del)} .stats .i b{color:var(--ins)} .stats .m b{color:var(--memo)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--ink-2);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;border-right:1px solid var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.spacer{flex:1}
.pager{display:inline-flex;align-items:center;border:1px solid var(--ink-2);border-radius:4px;overflow:hidden;font-family:var(--mono);font-size:calc(12px * var(--ui,1));font-variant-numeric:tabular-nums}
.pager button{border:0;background:transparent;padding:3px 8px;cursor:pointer;font-size:calc(14px * var(--ui,1));line-height:1.2}
.pager button:hover{background:var(--paper-2)}
.pager input{width:40px;border:0;border-left:1px solid var(--ink-2);background:transparent;text-align:center;padding:3px 2px;font-family:var(--mono);font-size:calc(12px * var(--ui,1))}
.pager input:focus{outline:none;background:var(--ins-bg)}
.pager .sl{color:var(--ink-3);padding:0 3px}
.pager b{font-weight:500;padding-right:4px;border-right:1px solid var(--ink-2);padding-left:1px;line-height:1.9}
.hint{font-size:calc(12px * var(--ui,1));color:var(--ink-3)}

/* ── 원고 + 여백 메모 ── */
.sheet{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) calc(280px * var(--ui,1));gap:28px;position:relative}
.doc{font-family:var(--serif);font-size:calc(16.5px * var(--z,1));line-height:1.95;max-width:70ch;padding:22px 26px 22px 30px;background:var(--paper);border:1px solid var(--rule);border-left:2px solid var(--rule-strong);border-radius:2px;
  box-shadow:inset 4px 0 0 var(--paper),inset 5px 0 0 var(--rule)}
.doc p{margin:0 0 .35em}
.doc p.gap{margin-top:1.3em}
.doc p.hd{font-weight:600;margin-top:1.4em}
.doc p.hd:first-child{margin-top:0}
del{color:var(--del);text-decoration:line-through;text-decoration-thickness:1.5px;background:var(--del-bg);border-radius:2px;padding:0 1px}
ins{color:var(--ins);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;background:var(--ins-bg);border-radius:2px;padding:0 1px}
.mk{display:inline-block;font-family:var(--mono);font-size:calc(10.5px * var(--ui,1));line-height:1;vertical-align:super;color:var(--del);border:1px solid var(--del-line);border-radius:8px;padding:2px 4px;margin:0 2px 0 1px;cursor:pointer;user-select:none;background:var(--paper)}
.mk:hover,.mk.hot{background:var(--del);color:#fff}
.hunk.hot del{outline:2px solid var(--del-line)} .hunk.hot ins{outline:2px solid var(--ins-line)}

.notes{position:relative;font-size:calc(14.5px * var(--ui,1))}
.note{position:absolute;left:0;right:0;border-left:2px solid var(--del-line);padding:2px 0 2px 10px;transition:top .15s}
.note.memo{border-left-color:var(--memo)}
.note .n{font-family:var(--mono);font-size:calc(12px * var(--ui,1));color:var(--del);display:flex;gap:6px;align-items:center;margin-bottom:.7em}
.note.memo .n{color:var(--memo)}
.note .n .k{color:var(--ink-3);font-family:var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.note .n .x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:0 2px;font-size:calc(13px * var(--ui,1));line-height:1}
.note .n .x:hover{color:var(--del)}
.note textarea{width:100%;border:0;border-bottom:1px dashed var(--rule);background:transparent;resize:none;padding:2px 0;line-height:1.5;min-height:22px;font-size:calc(14.5px * var(--ui,1));overflow:hidden}
.note textarea:focus{border-bottom-color:var(--focus);outline:none}
.note textarea.after{color:var(--ins);font-family:var(--serif)}
.note .txt{white-space:pre-wrap;line-height:1.5;color:var(--ink)}
.md{cursor:text;min-height:22px;border-bottom:1px dashed var(--rule);outline:none;white-space:pre-wrap}
.md:focus{border-bottom-color:var(--focus)}
.md b{font-weight:600}
.md:empty::before{content:attr(data-ph);color:var(--ink-3)}
.md code,.mlist code{font-family:var(--mono);font-size:.92em;background:var(--paper-3);padding:0 3px;border-radius:2px}
.md u{text-decoration-thickness:1px;text-underline-offset:2px}
.md s{color:var(--ink-3)}
.note .txt.after{color:var(--ins);font-family:var(--serif)}
.note .txt.after::before{content:"→ "}
.note .txt:empty::before{content:"메모 없음";color:var(--ink-3)}
.note .lbl{font-size:calc(10px * var(--ui,1));color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.note.hot{border-left-color:var(--del)}
.notes-title{font-size:calc(11px * var(--ui,1));letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;font-weight:600;position:absolute;top:-22px}
@media (prefers-reduced-motion: reduce){.note{transition:none}}

/* 좌우 비교: 원문 | 수정본 | 메모 */
.sheet.three{max-width:1480px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) calc(240px * var(--ui,1));gap:18px}
.sheet.three .doc{max-width:none;font-size:calc(15px * var(--z,1));line-height:1.85;padding:18px 18px 18px 22px}
.sheet .lab{font-family:var(--sans);font-size:calc(11px * var(--ui,1));letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;font-weight:600;display:flex;gap:10px}
.sheet .lab .d{color:var(--del)} .sheet .lab .i{color:var(--ins)}
.sheet.three .notes{font-size:calc(14px * var(--ui,1));padding-top:0}
.sheet.three .notes-title{position:static;margin-top:0}
@media (max-width:1240px){
  .sheet.three{grid-template-columns:1fr 1fr}
  .sheet.three .notes{grid-column:1/-1;position:static;columns:2;column-gap:24px}
  .sheet.three .note{position:static;margin:0 0 10px;break-inside:avoid}
}

/* ── PDF 문서형: 쪽을 원본 그대로 그리고 그 위에 표시 ── */
.sheet.pdf{max-width:1180px;grid-template-columns:minmax(0,1fr) calc(280px * var(--ui,1))}
/* 확대 시: 틀이 쪽 크기만큼 넓어지고, 화면을 넘치면 main 이 가로로 움직인다 */
.sheet.pdf.zoomed{max-width:none;width:max-content;grid-template-columns:auto calc(280px * var(--ui,1))}
.sheet.pdf.zoomed .pages{overflow:visible;max-width:none}
.sheet.pdf .notes-title{position:static;margin-bottom:8px}
.pages{display:flex;flex-direction:column;gap:18px;position:relative;overflow:auto;max-width:100%;background:var(--paper-3);padding:14px;border-radius:3px}
.page{position:relative;width:100%;margin:0 auto;flex:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);overflow:hidden}
.page canvas{display:block;width:100%;height:auto}
.page .pno{position:absolute;right:8px;bottom:6px;font-family:var(--mono);font-size:calc(10px * var(--ui,1));color:#8A909B;pointer-events:none;z-index:4}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;opacity:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:rgba(45,91,185,.35)}
.marks{position:absolute;inset:0;z-index:3;pointer-events:none}
/* 쪽은 항상 흰 종이이므로 표시 색은 고정값 */
.mbox{position:absolute;border-radius:1px}
.mbox.del,.mbox.rep{background:linear-gradient(to bottom,rgba(196,52,45,.10) 0,rgba(196,52,45,.10) calc(50% - 1px*var(--pz,1)),#C4342D calc(50% - 1px*var(--pz,1)),#C4342D calc(50% + 1px*var(--pz,1)),rgba(196,52,45,.10) calc(50% + 1px*var(--pz,1)))}
.mbox.memo{background:linear-gradient(to bottom,rgba(46,125,79,.10) 0,rgba(46,125,79,.10) calc(100% - 2px*var(--pz,1)),#2E7D4F calc(100% - 2px*var(--pz,1)))}
.mbox.hot{outline:2px solid rgba(196,52,45,.5)}
.marks .mk{position:absolute;pointer-events:auto;transform:translate(2px,-55%);background:#fff;z-index:4;font-size:calc(10.5px*var(--pz,1));padding:calc(2px*var(--pz,1)) calc(4px*var(--pz,1));border-radius:calc(8px*var(--pz,1));border-width:calc(1px*var(--pz,1))}
.marks .mk.memo{color:#2E7D4F;border-color:#7FC49A}
.marks .mk.memo:hover,.marks .mk.memo.hot{background:#2E7D4F;color:#fff}
.hide-marks .marks{display:none}
.pop{position:absolute;z-index:6;display:flex;gap:4px;background:var(--btn);padding:4px;border-radius:5px;box-shadow:0 3px 10px rgba(0,0,0,.25);transform:translate(-50%,8px)}
.pop button{border:0;background:transparent;color:var(--btn-ink);padding:4px 9px;border-radius:3px;cursor:pointer;font-size:calc(12.5px * var(--ui,1))}
.pop button:hover{background:rgba(127,127,127,.3)}
.pop button.d{color:#F0776E} .pop button.r{color:#86ACF2} .pop button.m{color:#7FC49A}
.pop kbd{font-family:var(--mono);font-size:calc(10px * var(--ui,1));opacity:.7;margin-left:2px}
.pdfmsg{padding:40px;text-align:center;color:var(--ink-3);border:1px dashed var(--rule)}

/* 메모 목록만 보기 */
.mlist{max-width:1120px;margin:0 auto;overflow-x:auto}
.mlist table{width:100%;border-collapse:collapse;font-size:calc(14px * var(--ui,1));min-width:640px}
.mlist th{text-align:left;font-size:calc(11px * var(--ui,1));letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:8px;border-bottom:1px solid var(--rule);font-weight:600;white-space:nowrap}
.mlist td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.55}
.mlist td.n{font-family:var(--mono);color:var(--del);width:34px;font-variant-numeric:tabular-nums}
.mlist .jump{font-family:var(--mono);color:var(--del);border:1px solid var(--del-line);background:transparent;border-radius:8px;padding:2px 7px;cursor:pointer;font-size:calc(12px * var(--ui,1))}
.mlist .jump:hover{background:var(--del);color:#fff}
.mlist td.w{color:var(--ink-3);white-space:nowrap;width:70px;font-variant-numeric:tabular-nums}
.mlist td.before{font-family:var(--serif)} .mlist td.after{font-family:var(--serif);color:var(--ins)}
.mlist td.reason{color:var(--ink-2)}
.mlist .none{padding:24px 8px;color:var(--ink-3)}

/* 총평 */
.overall{max-width:1120px;margin:22px auto 0;display:grid;grid-template-columns:minmax(0,1fr) calc(280px * var(--ui,1));gap:28px}
.overall .box{max-width:70ch;border-top:1px solid var(--rule);padding-top:12px}
.overall h3{font-size:calc(11px * var(--ui,1));letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;font-weight:600}
.overall textarea{width:100%;min-height:70px;border:1px solid var(--rule);background:var(--paper-2);padding:8px 10px;border-radius:3px;resize:vertical;line-height:1.5}
.overall .txt{white-space:pre-wrap;line-height:1.6}
.overall .md{min-height:44px;border:1px solid var(--rule);background:var(--paper-2);padding:8px 10px;border-radius:3px}
.overall .md:empty::before{content:attr(data-ph);color:var(--ink-3)}
.overall .txt:empty::before{content:"총평 없음";color:var(--ink-3)}

/* ── 편집 화면 ── */
.edit{max-width:1120px;margin:0 auto}
.edit h2{font-family:var(--serif);font-size:calc(22px * var(--ui,1));font-weight:600;margin:0 0 14px}
.types{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.types label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--rule);border-radius:4px;padding:10px 12px;cursor:pointer;flex:1;min-width:240px}
.types label.on{border-color:var(--ink);background:var(--paper-2)}
.types input{margin-top:3px}
.types b{display:block;font-weight:600}
.types span{font-size:calc(12px * var(--ui,1));color:var(--ink-2)}
.frow{display:grid;grid-template-columns:1fr 160px 200px;gap:12px;margin-bottom:14px}
.frow.lockrow{grid-template-columns:1fr 200px 1fr;align-items:end}
.frow .lockhint{font-size:calc(12px * var(--ui,1));color:var(--ink-3);padding-bottom:8px}
.frow .rm{display:flex;gap:6px;align-items:center;font-size:calc(13px * var(--ui,1));color:var(--ink-2)}
.frow label,.tcol label,.pdfpick label.l{display:block;font-size:calc(11px * var(--ui,1));letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:4px}
.frow input,.frow select{width:100%;border:1px solid var(--rule);background:var(--paper-2);padding:7px 10px;border-radius:3px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tcol{min-width:0}
.tcol .lab{display:flex;align-items:baseline;gap:8px}
.tcol .lab .cnt{margin-left:auto;font-family:var(--mono);font-size:calc(11px * var(--ui,1));color:var(--ink-3);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.tcol textarea{width:100%;min-height:380px;border:1px solid var(--rule);background:var(--paper-2);padding:10px 12px;border-radius:3px;font-family:var(--serif);font-size:calc(14.5px * var(--ui,1));line-height:1.75;resize:vertical}
.tcol textarea.over,.pdfpick .zone.over{border-color:var(--rule-strong);background:var(--paper-3)}
.drop{margin-top:6px;font-size:calc(12px * var(--ui,1));color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drop input[type=file],.pdfpick input[type=file]{display:none}
.pdfpick .zone{display:block;border:1px dashed var(--rule);border-radius:4px;padding:28px;text-align:center;color:var(--ink-2);background:var(--paper-2);cursor:pointer}
.pdfpick .zone .f{font-family:var(--mono);font-size:calc(12px * var(--ui,1));color:var(--ink);margin-top:8px}
.edit .actions{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
.msg{font-size:calc(13px * var(--ui,1));color:var(--ink-2)}
.msg.err{color:var(--del)}

/* ── 자체 확인창 ── */
.ask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.ask .box{background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ask p{margin:0 0 14px;line-height:1.55}
.ask .row{display:flex;gap:8px;justify-content:flex-end}

.ask .box h3{margin:0 0 8px;font-family:var(--serif);font-size:calc(18px * var(--ui,1))}
.ask .box input[type=password]{width:100%;border:1px solid var(--rule);background:var(--paper-2);padding:9px 10px;border-radius:3px;margin-bottom:8px;font-size:calc(15px * var(--ui,1))}
.ask .box .rm{display:flex;gap:6px;align-items:center;font-size:calc(13px * var(--ui,1));color:var(--ink-2);margin-bottom:6px}
.ask .box .l{display:block;font-size:calc(11px * var(--ui,1));letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:6px 0 4px}
.ask .box .msg{min-height:18px;margin-bottom:8px}
.ask.lock{background:var(--paper)}

.ask .box.hist{max-width:520px}
.ask .box.hist ul{list-style:none;margin:0 0 12px;padding:0;max-height:50vh;overflow:auto;border:1px solid var(--rule);border-radius:4px}
.ask .box.hist li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--rule);font-size:calc(13px * var(--ui,1));cursor:pointer}
.ask .box.hist li:last-child{border-bottom:0}
.ask .box.hist li:hover{background:var(--paper-2)}
.ask .box.hist li.now{background:var(--paper-3);cursor:default;font-weight:600}
.ask .box.hist li.redo{color:var(--ink-3)}
.ask .box.hist li .k{font-family:var(--mono);font-size:calc(11px * var(--ui,1));color:var(--del);min-width:28px}
.ask .box.hist li.redo .k{color:var(--ins)}
.ask .box.hist li .t{margin-left:auto;font-family:var(--mono);font-size:calc(11px * var(--ui,1));color:var(--ink-3)}

/* ── 맨 위/맨 아래 동그란 버튼 ── */
.fab{width:28px;height:28px;border-radius:50%;border:1px solid var(--ink-2);background:transparent;color:var(--ink);font-size:calc(14px * var(--ui,1));line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;margin-right:2px}
.fab:hover{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:8px 14px;border-radius:4px;font-size:calc(13px * var(--ui,1));opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}

/* ── 반응형 ── */
@media (max-width:980px){
  .sheet,.overall,.sheet.pdf{grid-template-columns:1fr}
  .notes{position:static}
  .note{position:static;margin:6px 0}
  .notes-title{position:static;margin-top:16px}
  .frow{grid-template-columns:1fr}
  .tgrid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;--rail-w:0px}
  .head{position:static}
  .rail{border-right:0;border-bottom:1px solid var(--rule);padding-block:10px;position:static;height:auto;overflow:visible}
  .shell.nrail{grid-template-columns:1fr}
  .shell.nrail .rail h2 .fold{writing-mode:horizontal-tb;padding:6px 9px}
  .doc{padding:16px 16px;font-size:calc(15.5px * var(--ui,1))}
  main{padding-inline:16px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand" role="link" tabindex="0" title="홈으로"><span class="pen"></span><h1>쑤닐의 퇴고장</h1><span class="sub">받은 글, 고친 자리, 고친 이유</span></div>
  <span id="whoami" class="chip"></span>
  <button class="btn" id="btnPw" hidden>비밀번호 바꾸기</button>
  <span class="zoom" title="화면 글자 크기 (문서 제외)"><button id="uiMinus" aria-label="글자 작게">가−</button><button class="z" id="uiReset" title="기본으로">100%</button><button id="uiPlus" aria-label="글자 크게">가+</button></span>
  <button class="btn" id="btnLock">로그아웃</button>
  <button class="btn" id="btnList">홈</button>
  <button class="btn primary" id="btnNew">새 퇴고</button>
</header>

<div class="shell">
  <aside class="rail" id="rail">
    <h2 id="railTitle"><span class="t">목록</span><button class="fold" id="btnRail" title="목록 접기/펼치기" aria-label="목록 접기/펼치기">« 접기</button></h2>
    <div class="selrow"><button class="btn small" id="btnSel" hidden>다수 선택</button></div>
    <div class="selbar" id="selBar" hidden><button class="btn small danger" id="selDel">선택 삭제 (0)</button><button class="btn small" id="selAll">전체</button></div>
    <ul class="cases" id="caseList"></ul>
    <div class="empty" id="caseEmpty" hidden>아직 문서가 없습니다. 「새 퇴고」로 시작하세요.</div>
  </aside>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SOURCES = ['슬랙','PDF','워드','네이버 블로그','기타'];
const KIND = {del:'삭제', rep:'바꾸기', memo:'메모'};

let cases = [];   // docs/index.json 의 메타. 문서를 열면 복호화된 내용이 같은 객체에 합쳐진다(loaded=true)

let artifactNs = null;   // 편집자면 {} (저장 버튼 표시 플래그로만 쓴다)
let view = {mode:'list', id:null, draft:null, dirty:false, show:'side'};
const isPdf = c => c && c.type==='pdf';

// ══════════════ 문장 단위 diff 엔진 (텍스트형) ══════════════
function splitUnits(text){
  const lines = text.replace(/\r\n?/g,'\n').split('\n');
  const units = []; let gap = false;
  lines.forEach((line, p) => {
    const s = line.trim();
    if (!s){ gap = true; return; }
    const hd = /^[\[【<（(].{0,20}[\]】>）)]$/.test(s) || (s.length <= 20 && /^\d+[.)]\s*\S/.test(s));
    // 문장 끝 뒤 공백에서 자름. '2026. 8. 12.' 같은 숫자 뒤 마침표는 제외
    const parts = hd ? [s] : s.split(/(?<=[^\d\s][.!?。]["”’)\]]?)\s+(?=\S)|(?<=[”’])\s+(?=\S)/).filter(Boolean);
    parts.forEach((t, i) => units.push({t, p, first: i===0, gap: i===0 && gap && units.length>0, hd}));
    gap = false;
  });
  return units;
}
function lcsTable(a, b, eq){
  const n=a.length, m=b.length; const dp = Array.from({length:n+1}, () => new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--)
    dp[i][j] = eq(a[i],b[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  return dp;
}
function diffSeq(a, b, eq){
  const dp = lcsTable(a,b,eq); const ops=[]; let i=0,j=0;
  while (i<a.length && j<b.length){
    if (eq(a[i],b[j])){ ops.push({op:'eq', a:a[i], b:b[j]}); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]){ ops.push({op:'del', a:a[i]}); i++; }
    else { ops.push({op:'ins', b:b[j]}); j++; }
  }
  while (i<a.length) ops.push({op:'del', a:a[i++]});
  while (j<b.length) ops.push({op:'ins', b:b[j++]});
  return ops;
}
const norm = s => s.replace(/\s+/g,' ').trim();
function bigrams(s){ const t = norm(s).replace(/\s/g,''); const set = new Map(); for (let i=0;i<t.length-1;i++){ const g=t.slice(i,i+2); set.set(g,(set.get(g)||0)+1);} return set; }
function similarity(a, b){
  const A=bigrams(a), B=bigrams(b); let inter=0, tot=0;
  A.forEach((v,k)=>{ tot+=v; if (B.has(k)) inter += Math.min(v, B.get(k)); });
  B.forEach(v=>{ tot+=v; });
  return tot ? (2*inter)/tot : 0;
}
const tokens = s => norm(s).split(' ');
function inlineDiff(a, b){
  const ops = diffSeq(tokens(a), tokens(b), (x,y)=>x===y);
  const eqCount = ops.filter(o=>o.op==='eq').length;
  if (eqCount / Math.max(ops.length,1) < 0.25) return [{k:'del',t:a},{k:'ins',t:b}];
  const out=[]; ops.forEach(o => {
    const k = o.op, t = k==='ins' ? o.b : o.a;
    const last = out[out.length-1];
    if (last && last.k===k) last.t += ' ' + t; else out.push({k, t});
  });
  return out;
}
function diffText(orig, rev){
  const A = splitUnits(orig), B = splitUnits(rev);
  const ops = diffSeq(A, B, (x,y)=>norm(x.t)===norm(y.t));
  const rows=[]; let i=0;
  A.forEach(u=>{ u.mark={kind:'eq'}; }); B.forEach(u=>{ u.mark={kind:'eq'}; });
  while (i<ops.length){
    if (ops[i].op==='eq'){ rows.push({kind:'eq', u:ops[i].b, text:ops[i].b.t}); i++; continue; }
    const dels=[], inss=[];
    while (i<ops.length && ops[i].op!=='eq'){ (ops[i].op==='del'?dels:inss).push(ops[i].op==='del'?ops[i].a:ops[i].b); i++; }
    const pairs=[]; const usedB=new Set();
    dels.forEach((d,di)=>{
      let best=-1, bs=0.38;
      inss.forEach((s,si)=>{ if (usedB.has(si)) return; const v=similarity(d.t,s.t); if (v>bs){bs=v;best=si;} });
      if (best>=0){ usedB.add(best); pairs.push({di, si:best}); }
    });
    const emitted=new Set();
    dels.forEach((d,di)=>{
      const pr = pairs.find(p=>p.di===di);
      inss.forEach((s,si)=>{ if (!usedB.has(si) && !emitted.has(si) && (pr ? si<pr.si : false)){ emitted.add(si); rows.push({kind:'ins', u:s, text:s.t}); }});
      if (pr){ const s=inss[pr.si]; rows.push({kind:'mod', u:s, ua:d, before:d.t, after:s.t, frag:inlineDiff(d.t,s.t)}); emitted.add(pr.si); }
      else rows.push({kind:'del', u:d, text:d.t});
    });
    inss.forEach((s,si)=>{ if (!emitted.has(si)){ emitted.add(si); rows.push({kind:'ins', u:s, text:s.t}); }});
  }
  let n=0; rows.forEach(r=>{ if (r.kind!=='eq'){ n++; r.hunk=n; r.key = memoKey(r);
    if (r.kind==='del') r.u.mark={kind:'del',hunk:n};
    else if (r.kind==='ins') r.u.mark={kind:'ins',hunk:n};
    else { r.ua.mark={kind:'mod',hunk:n,frag:r.frag}; r.u.mark={kind:'mod',hunk:n,frag:r.frag}; }
  }});
  rows.A=A; rows.B=B;
  return rows;
}
function sideHtml(units, side, marks){
  let html='', open=false;
  units.forEach(u=>{
    if (u.first || !open){ if (open) html+='</p>'; html += `<p class="${u.hd?'hd':''}${u.gap?' gap':''}">`; open=true; }
    else html += ' ';
    const m=u.mark||{kind:'eq'};
    if (!marks || m.kind==='eq'){ html += esc(u.t); return; }
    const mk = `<span class="mk" data-h="${m.hunk}" title="메모 ${m.hunk}">${m.hunk}</span>`;
    if (m.kind==='del') html += `<span class="hunk" data-h="${m.hunk}"><del>${esc(u.t)}</del>${mk}</span>`;
    else if (m.kind==='ins') html += `<span class="hunk" data-h="${m.hunk}"><ins>${esc(u.t)}</ins>${mk}</span>`;
    else {
      const keep = side==='a' ? 'del' : 'ins';
      const inner = m.frag.filter(f=>f.k==='eq'||f.k===keep).map(f=> f.k==='eq' ? esc(f.t) : `<${keep}>${esc(f.t)}</${keep}>`).join(' ');
      html += `<span class="hunk" data-h="${m.hunk}">${inner}${mk}</span>`;
    }
  });
  if (open) html+='</p>';
  return html;
}
function memoKey(r){
  const s = (r.kind==='mod' ? r.before+'→'+r.after : r.kind+':'+r.text);
  let h=0; for (let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return 'k'+(h>>>0).toString(36);
}
function getMemo(c, r){ const m=c.memos||{}; return m[r.key] ?? m['m'+r.hunk] ?? ''; }

// ══════════════ 목록/라우팅 ══════════════
function caseCount(c){ if (!c.loaded) return c.n||0; return isPdf(c) ? (c.marks||[]).length : diffText(c.orig||'', c.rev||'').filter(r=>r.kind!=='eq').length; }
function renderList(){
  const ul=$('#caseList'); ul.innerHTML='';
  $('#caseEmpty').hidden = cases.length>0;
  [...cases].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.id||'').localeCompare(a.id||'')).forEach(c=>{
    const li=document.createElement('li'); li.className = (view.mode==='case' && view.id===c.id) ? 'on' : ''; li.title = c.title||''; li.dataset.id=c.id;
    if (selMode) li.classList.add('sel');
    li.innerHTML = (selMode ? `<input type="checkbox" class="ck" ${selIds.has(c.id)?'checked':''}>` : '') + (artifactNs && !selMode ? `<button class="more" title="정보 수정 · 삭제">…</button>` : '') + `<span class="t">${esc(c.title||'(제목 없음)')}</span><span class="m"><span>${esc(c.date||'')}</span><span class="chip ${isPdf(c)?'pdf':''}">${isPdf(c)?'PDF 문서':esc(c.source||'')}</span>${c.lock?'<span title="문서 비밀번호 있음">🔒</span>':''}<span>${caseCount(c)}곳</span></span>`;
    li.addEventListener('click', e=>{
      if (selMode){
        const items=[...ul.querySelectorAll('li')]; const idx=items.indexOf(li);
        if (e.shiftKey && lastSel>=0){   // Shift+클릭 = 범위 선택
          const [a,b]=[Math.min(lastSel,idx), Math.max(lastSel,idx)];
          items.slice(a,b+1).forEach(x=>{ selIds.add(x.dataset.id); x.querySelector('.ck').checked=true; });
          getSelection().removeAllRanges();
        } else { if (selIds.has(c.id)) selIds.delete(c.id); else selIds.add(c.id); li.querySelector('.ck').checked=selIds.has(c.id); }
        lastSel=idx; syncSelBar(); return; }
      openCase(c.id);
    });
    const mb=li.querySelector('.more'); if (mb) mb.addEventListener('click', e=>{ e.stopPropagation(); showItemMenu(mb, c); });
    ul.appendChild(li);
  });
  syncSelBar();
}
// ── 목록 항목 메뉴(…): 정보 수정 / 삭제 ──
function showItemMenu(btn, c){
  document.querySelectorAll('.imenu').forEach(m=>m.remove());
  const m=document.createElement('div'); m.className='imenu';
  m.innerHTML=`<button data-a="edit">정보 수정</button><button data-a="del" class="d">삭제</button>`;
  const r=btn.getBoundingClientRect(); m.style.left=(r.right-140)+'px'; m.style.top=(r.bottom+4)+'px';
  document.body.appendChild(m);
  const close=()=>{ m.remove(); document.removeEventListener('mousedown', onDown); };
  const onDown=e=>{ if (!m.contains(e.target)) close(); };
  setTimeout(()=>document.addEventListener('mousedown', onDown), 0);
  m.querySelector('[data-a="edit"]').addEventListener('click', async ()=>{ close(); await editCaseById(c.id); });
  m.querySelector('[data-a="del"]').addEventListener('click', async ()=>{ close(); if (!(await ask(`「${c.title}」 문서를 지웁니다. 되돌릴 수 없습니다.`,'지우기'))) return; await deleteMany([c.id]); });
}
async function editCaseById(id){
  if (!(await leaveOk())) return;
  const c=cases.find(x=>x.id===id); if (!c) return;
  try { if (!c.loaded) await loadDoc(c); } catch(e){ toast('열지 못했습니다: '+((e&&e.message)||e)); return; }
  view={mode:'edit', id, draft:c, dirty:false, show:'side'}; location.hash='case='+id; render();
}
// ── 다수 선택 삭제 ──
let selMode=false, lastSel=-1; const selIds=new Set();
function syncSelBar(){
  const bar=$('#selBar'); if (!bar) return;
  bar.hidden=!selMode; $('#selDel').textContent=`선택 삭제 (${selIds.size})`; $('#selDel').disabled=!selIds.size;
  $('#btnSel').textContent = selMode ? '선택 끝' : '다수 선택';
}
async function deleteMany(ids){
  if (!token){ toast('편집자만 지울 수 있습니다'); return; }
  toast(`${ids.length}건 지우는 중…`);
  try {
    for (const id of ids){ const c=cases.find(x=>x.id===id); if (!c) continue;
      await ghDelete(`docs/${id}.json`, `delete: ${c.title}`); if (isPdf(c)) await ghDelete(`docs/${id}.pdf.enc`, `delete pdf: ${c.title}`); }
    await updateIndex(list=>{ for (const id of ids){ const i=list.findIndex(x=>x.id===id); if (i>=0) list.splice(i,1); } });
    cases=cases.filter(x=>!ids.includes(x.id)); ids.forEach(id=>selIds.delete(id));
    if (ids.includes(view.id)){ view={mode:'list',id:null,draft:null,dirty:false,show:'side'}; location.hash=''; }
    toast(`${ids.length}건 지웠습니다`); render();
  } catch(e){ toast('삭제 실패: '+((e&&e.message)||e)); }
}
// 저장 안 한 채 떠날 때: 저장하고 이동 / 버리기 / 취소. 편집 화면(입력 중)은 저장 대상이 없으니 버리기/취소만
async function leaveOk(){
  if (!view.dirty) return true;
  const c = view.mode==='case' ? (view.draft || cases.find(x=>x.id===view.id)) : null;
  const choice = await ask3('저장하지 않은 내용이 있습니다.', c && artifactNs ? '저장하고 이동' : null);
  if (choice==='cancel') return false;
  if (choice==='save'){ (isPdf(c)?collectMarks:collectMemos)(c); const ok=await saveDoc(c, $('#saveCase')); return !!ok; }
  return true;
}
function ask3(msg, saveLabel){

// ── 슬랙식 서식: *굵게* _기울임_ __밑줄__ ~취소선~ `코드` ──
function md(s){
  let h=esc(s);
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/\*([^*\n]+)\*/g,'<b>$1</b>');
  h=h.replace(/__([^_\n]+)__/g,'<u>$1</u>');
  h=h.replace(/(^|[^\w가-힣])_([^_\n]+)_(?=$|[^\w가-힣])/g,'$1<i>$2</i>');
  h=h.replace(/~([^~\n]+)~/g,'<s>$1</s>');
  return h.replace(/\n/g,'<br>');
}
// 서식이 바로 보이는 편집칸. 화면은 contenteditable, 저장은 숨은 textarea 에 슬랙 표기(*_~__`)로 동기화한다
function mdField(raw, attrs, ph, cls){
  return `<div class="fld"><textarea rows="1" ${attrs} hidden>${esc(raw)}</textarea><div class="${cls||'txt'} md" contenteditable="true" spellcheck="false" data-ph="${esc(ph)}">${md(raw)}</div></div>`;
}
// HTML → 슬랙 표기
function htmlToMd(node){
  let out='';
  node.childNodes.forEach(n=>{
    if (n.nodeType===3){ out+=n.nodeValue.replace(/ /g,' '); return; }
    if (n.nodeType!==1) return;
    const tag=n.tagName.toLowerCase(); const inner=htmlToMd(n);
    const st=(n.getAttribute('style')||'').toLowerCase();
    if (tag==='br'){ out+='\n'; return; }
    if (tag==='div'||tag==='p'){ out+=(out && !out.endsWith('\n') ? '\n' : '')+inner; if (tag==='p') out+='\n'; return; }
    if (!inner.trim()){ out+=inner; return; }
    if (tag==='b'||tag==='strong'||/font-weight:\s*(bold|[6-9]00)/.test(st)) out+='*'+inner+'*';
    else if (tag==='i'||tag==='em'||/font-style:\s*italic/.test(st)) out+='_'+inner+'_';
    else if (tag==='u'||/text-decoration[^;]*underline/.test(st)) out+='__'+inner+'__';
    else if (tag==='s'||tag==='strike'||tag==='del'||/text-decoration[^;]*line-through/.test(st)) out+='~'+inner+'~';
    else if (tag==='code') out+='`'+inner+'`';
    else out+=inner;
  });
  return out;
}
function bindMd(root){
  (root||document).querySelectorAll('.fld').forEach(f=>{
    const t=f.querySelector('textarea'), d=f.querySelector('.md'); if (!t||!d||t.dataset.md) return; t.dataset.md='1';
    const sync=()=>{ if (d.innerHTML==='<br>') d.innerHTML=''; const v=htmlToMd(d).replace(/\n+$/,''); if (v!==t.value){ t.value=v; t.dispatchEvent(new Event('input')); } };
    d.addEventListener('input', sync);
    d.addEventListener('blur', ()=>{ sync(); d.innerHTML=md(t.value); });   // 나올 때 표준형으로 다시 그려 잡티 제거
    d.addEventListener('paste', e=>{ e.preventDefault(); const txt=(e.clipboardData||window.clipboardData).getData('text/plain'); document.execCommand('insertText', false, txt); });
    d.addEventListener('keydown', e=>{
      if (!(e.ctrlKey||e.metaKey)) return; const k=e.key.toLowerCase();
      const cmd = k==='b' ? 'bold' : k==='i' ? 'italic' : k==='u' ? 'underline' : (k==='x' && e.shiftKey) ? 'strikeThrough' : null;
      if (!cmd) return; e.preventDefault(); document.execCommand(cmd, false, null); sync();
    });
  });
}
function wrapSel(t, mark){
  const s=t.selectionStart, e=t.selectionEnd, v=t.value, inner=v.slice(s,e), L=mark.length;
  const put=(from,to,text,selA,selB)=>{ t.setSelectionRange(from,to); let ok=false; try{ ok=document.execCommand('insertText', false, text); }catch(_){ } if (!ok){ t.value=v.slice(0,from)+text+v.slice(to); } t.setSelectionRange(selA,selB); t.dispatchEvent(new Event('input')); };
  if (s>=L && v.slice(s-L,s)===mark && v.slice(e,e+L)===mark) put(s-L,e+L,inner,s-L,e-L);
  else if (inner.length>=2*L && inner.startsWith(mark) && inner.endsWith(mark)) put(s,e,inner.slice(L,inner.length-L),s,e-2*L);
  else put(s,e,mark+inner+mark,s+L,e+L);
}

        ${canEdit ? mdField(getMemo(c,r), `data-key="${r.key}"`, '왜 고쳤는지') : `<div class="txt">${md(getMemo(c,r))}</div>`}</div>`).join('')}</div>`;

      <div><div class="lab">수정본 그대로 <span class="i">넣은 곳</span></div><div class="doc docB" id="doc">${sideHtml(rows.B,'b',true)}</div></div>${notesHtml}`;

function collectMemos(c){
  const m = Object.assign({}, c.memos||{});
  const tas = document.querySelectorAll('.note textarea[data-key]');
  tas.forEach(t=>{ const v=t.value.trim(); if (v) m[t.dataset.key]=v; else delete m[t.dataset.key]; });

}
function docHtml(rows){
  let html='', open=false;
  rows.forEach(r=>{
    const u=r.u;
    if (u.first || !open){ if (open) html+='</p>'; html += `<p class="${u.hd?'hd':''}${u.gap?' gap':''}">`; open=true; }
    else html += ' ';
    const mk = `<span class="mk" data-h="${r.hunk}" title="메모 ${r.hunk}">${r.hunk}</span>`;
    if (r.kind==='eq') html += esc(r.text);
    else if (r.kind==='del') html += `<span class="hunk" data-h="${r.hunk}"><del>${esc(r.text)}</del>${mk}</span>`;
    else if (r.kind==='ins') html += `<span class="hunk" data-h="${r.hunk}"><ins>${esc(r.text)}</ins>${mk}</span>`;
    else {
      const inner = r.frag.map(f=> f.k==='eq' ? esc(f.t) : f.k==='del' ? `<del>${esc(f.t)}</del>` : `<ins>${esc(f.t)}</ins>`).join(' ');
      html += `<span class="hunk" data-h="${r.hunk}">${inner}${mk}</span>`;
    }
  });
  if (open) html+='</p>';
  return html;
}

// ══════════════ 확대·축소 ══════════════
let zoomT=null;
function setZoom(c, delta, reset){
  const k = isPdf(c) ? 'pdf' : 'text';
  const nz = reset ? 1 : Math.min(3, Math.max(0.5, Math.round((zoom[k]+delta)*10)/10));
  if (nz===zoom[k]) return;
  zoom[k]=nz; try { localStorage.setItem('redpen.zoom', JSON.stringify(zoom)); } catch(e){}
  const lab=$('#zoomReset'); if (lab) lab.textContent = Math.round(nz*100)+'%';
  if (k==='text'){ $('#main').style.setProperty('--z', nz); requestAnimationFrame(()=>layoutNotes()); }
  else { clearTimeout(zoomT); zoomT=setTimeout(()=>{ if (pdfState && $('#doc')) drawPages(); }, 120); }
}
$('#main').addEventListener('wheel', e=>{
  if (!(e.ctrlKey||e.metaKey)) return;
  const c = view.draft || cases.find(x=>x.id===view.id); if (!c || view.mode!=='case') return;
  e.preventDefault(); setZoom(c, e.deltaY<0 ? 0.1 : -0.1);

function bindNotes(){
  bindMd(document);
  document.querySelectorAll('.note textarea').forEach(t=>{ if (!t.hidden) autosize(t); t.addEventListener('input', ()=>{ autosize(t); view.dirty=true; layoutNotes(); }); });
  document.querySelectorAll('.mk').forEach(m=>m.addEventListener('click', ()=>focusHunk(m.dataset.h)));
  document.querySelectorAll('.note').forEach(n=>{ n.addEventListener('mouseenter', ()=>hot(n.dataset.h, true)); n.addEventListener('mouseleave', ()=>hot(n.dataset.h, false)); });
}
function layoutNotes(){
  const notes=$('#notes'), doc=$('#doc'); if (!notes || !doc || notes.hidden) return;
  const stacked = window.innerWidth <= 980 || (notes.closest('.three') && window.innerWidth <= 1240);
  if (stacked){ notes.style.height=''; notes.querySelectorAll('.note').forEach(n=>n.style.top=''); return; }
  const base = notes.getBoundingClientRect().top; let bottom = notes.closest('.pdf') || notes.closest('.three') ? 26 : 0;
  notes.querySelectorAll('.note').forEach(n=>{
    const h = n.dataset.h; const target = doc.querySelector(`.hunk[data-h="${h}"]`);
    let top = target ? target.getBoundingClientRect().top - base - 2 : bottom;
    top = Math.max(top, bottom); n.style.top = top+'px'; bottom = top + n.offsetHeight + 10;
  });
  notes.style.height = Math.max(bottom, 0)+'px';

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('불러오기 실패: '+src)); document.head.appendChild(s); }); }

async function drawPages(){
  const st = pdfState; if (!st) return; const token = st.token = Symbol();
  const cont = $('#doc'); if (!cont) return;
  cont.innerHTML=''; cont.classList.remove('pdfmsg');
  // 기준 폭 = 100%일 때의 문서 열 폭. 확대하면 틀(.pages)을 그 배수로 키운다
  const sheet = cont.closest('.sheet'); const stacked = window.innerWidth <= 980;
  const mainW = $('#main').clientWidth - 40 - 28;
  const notesW = Math.round(280*uiScale);
  const baseW = stacked ? mainW : Math.max(320, Math.min(1180, mainW) - notesW - 28);
  const width = Math.round(baseW * zoom.pdf); const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  if (sheet){ sheet.classList.toggle('zoomed', !stacked); }              // 100% 에서도 확대 때와 같은 배치
  // 창 가로 스크롤은 실제로 틀+메모가 창을 넘칠 때만, 넘치는 만큼만. (fit-content 로 재면 안내 줄 같은 긴 글이 한 줄로 펴져 폭을 부풀린다)

  const over = !stacked && need > document.documentElement.clientWidth;
  document.body.style.minWidth = over ? need+'px' : '';
  document.body.classList.toggle('zoomed-body', over);
  cont.style.width = !stacked ? (width+28)+'px' : '';   // 홈통 여백 14px×2
  cont.style.setProperty('--pz', String(zoom.pdf));

    const page = await st.doc.getPage(p); if (st.token!==token) return;
    const base = page.getViewport({scale:1}); const scale = width/base.width; const vp = page.getViewport({scale});
    const el=document.createElement('div'); el.className='page'; el.dataset.p=p; el.style.height = vp.height+'px'; el.style.width = vp.width+'px';
    const canvas=document.createElement('canvas'); canvas.width=Math.floor(vp.width*dpr); canvas.height=Math.floor(vp.height*dpr);
    canvas.style.width=vp.width+'px'; canvas.style.height=vp.height+'px';
    const tl=document.createElement('div'); tl.className='textLayer'; tl.style.setProperty('--scale-factor', String(scale));
    const ml=document.createElement('div'); ml.className='marks';
    el.append(canvas, tl, ml); const pn=document.createElement('div'); pn.className='pno'; pn.textContent=p+' / '+st.doc.numPages; el.appendChild(pn);
    cont.appendChild(el);
    await page.render({canvasContext: canvas.getContext('2d'), viewport: vp, transform: dpr!==1 ? [dpr,0,0,dpr,0,0] : null}).promise;
    if (st.token!==token) return;

    drawMarks(st.c, p);
    layoutNotes();
  }

  fitOverall();
  if (pendingSpot){ const ps=pendingSpot; pendingSpot=null; restoreSpot(ps.y); }
}
function drawMarks(c, p){

    const i={Digit1:0, Digit2:1, Digit3:2, Numpad1:0, Numpad2:1, Numpad3:2}[e.code]; if (i===undefined) return;

// ── 총평 폭을 문서 폭에 맞춘다(PDF 는 쪽 틀, 텍스트는 원고 열 전체) ──
function fitOverall(){

  if (!doc || !sheet){ box.style.width=''; return; }

// ── 목록의 번호 → 문서의 그 자리로 ──
function jumpToHunk(h){
  const target=document.querySelector(`#doc .hunk[data-h="${h}"], .page .hunk[data-h="${h}"]`); if (!target) return false;
  const y=target.getBoundingClientRect().top + window.scrollY - headLine() - 60;
  window.scrollTo({top:Math.max(0,y), behavior:'smooth'});
  hot(h,true); setTimeout(()=>hot(h,false), 2000);
  return true;
}
function bindJumps(root, before){
  (root||document).querySelectorAll('.mlist .jump').forEach(b=>b.addEventListener('click', ()=>{ const h=+b.dataset.n; before(); setTimeout(()=>jumpToHunk(h), 60); }));
}

// ── 쪽 이동: 고정된 머리 아래 선을 기준으로 지금 보이는 쪽을 센다 ──
function headLine(){ const h=$('.head'); return (h ? h.getBoundingClientRect().bottom : 0) + 6; }
function currentPage(){
  const line=headLine(); let cur=0;
  for (const el of document.querySelectorAll('.page')){ const r=el.getBoundingClientRect(); cur=+el.dataset.p; if (r.bottom > line) break; }
  return cur;
}
function goPage(n){
  // 목록만 보기 중이면 문서 위 표시로 돌아간 뒤 이동
  if (pdfListMode){ const c=view.draft||cases.find(x=>x.id===view.id); if (c){ pdfListMode=false; refreshPdfHead(c); setTimeout(()=>goPage(n), 80); } return; }
  const pages=document.querySelectorAll('.page'); if (!pages.length) return;
  n=Math.max(1, Math.min(pages.length, Math.round(n)||1));
  const el=document.querySelector(`.page[data-p="${n}"]`); if (!el) return;
  const y=el.getBoundingClientRect().top + window.scrollY - headLine();
  window.scrollTo({top:y, behavior:'smooth'});
  const pi=$('#pgIn'); if (pi) pi.value=n;
}
let pgT=null;
window.addEventListener('scroll', ()=>{ clearTimeout(pgT); pgT=setTimeout(()=>{ const pi=$('#pgIn'); if (pi && document.activeElement!==pi){ const p=currentPage(); if (p) pi.value=p; } }, 80); }, {passive:true});
document.addEventListener('keydown', e=>{
  if (!e.altKey || e.ctrlKey || e.metaKey) return;
  if (!document.querySelector('.page')) return;
  if (e.code==='KeyW'){ e.preventDefault(); goPage((currentPage()||1)-1); }
  else if (e.code==='KeyS'){ e.preventDefault(); goPage((currentPage()||1)+1); }
  else if (e.code==='KeyG'){ e.preventDefault(); const pi=$('#pgIn'); if (pi){ pi.focus(); pi.select(); } }
});

async function loadTextFile(file, target, msgEl){

      if (!window.mammoth) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      const r = await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()}); text = r.value;
    } else throw new Error('DOCX, TXT만 읽습니다. PDF는 「PDF 문서」 유형으로 넣으세요.');
    text = text.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
    target.value = text; target.dispatchEvent(new Event('input'));
    msgEl.textContent = `${file.name} · ${text.replace(/\s/g,'').length}자`;
  } catch(e){ msgEl.textContent = '실패: ' + e.message; }
}

// ══════════════ 깃헙 저장 + 암호화 ══════════════
// 파일 배치: config.json(열쇠 봉투) · docs/index.json(목록 메타) · docs/{id}.json(메타+암호문) · docs/{id}.pdf.enc(PDF 암호문)
const GH = {owner:'Sunnyhill-K', repo:'redpen', branch:'main'};
let role=null, K=null, Kraw=null, token=null, cfg=null;
const te=new TextEncoder(), td=new TextDecoder();
function b64(u8){ let out=''; for (let i=0;i<u8.length;i+=0x8000) out+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(out); }
function ub64(str){ return Uint8Array.from(atob(str), ch=>ch.charCodeAt(0)); }
async function kek(pw, saltB64, iter){
  const km=await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:ub64(saltB64), iterations:iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encB(key, u8){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, u8)); const out=new Uint8Array(12+ct.length); out.set(iv); out.set(ct,12); return out; }
async function decB(key, u8){ u8=new Uint8Array(u8); return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:u8.slice(0,12)}, key, u8.slice(12))); }
const importK = raw => crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
let Ke=null;   // 편집자 전용키: 잠긴 문서의 열쇠를 이걸로도 싸 두어 편집자는 문서 비밀번호 없이 연다
async function deriveKe(kraw, tok){
  const km=await crypto.subtle.importKey('raw', kraw, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF', hash:'SHA-256', salt:te.encode(tok), info:te.encode('redpen-editor-key')}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
const docKeys = {};   // id → CryptoKey (이 페이지 안에서만 기억)
function askPw(title){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='ask';
    ov.innerHTML=`<form class="box" role="dialog" aria-modal="true"><h3>🔒 ${esc(title)}</h3><p>이 문서는 비밀번호가 따로 걸려 있습니다.</p>
      <input type="password" id="dpw" autocomplete="off" placeholder="문서 비밀번호"><div class="msg err" id="dpwErr"></div>
      <div class="row"><button class="btn" type="button" id="dpwCancel">취소</button><button class="btn primary" type="submit">열기</button></div></form>`;
    document.body.appendChild(ov); ov.querySelector('#dpw').focus();
    ov.querySelector('#dpwCancel').addEventListener('click', ()=>{ ov.remove(); res(null); });
    ov.querySelector('form').addEventListener('submit', e=>{ e.preventDefault(); const v=ov.querySelector('#dpw').value; ov.remove(); res(v); });
  });
}
// 잠긴 문서의 열쇠 얻기: 편집자는 Ke 로, 뷰어는 문서 비밀번호로
async function docKey(c, d){
  if (docKeys[c.id]) return docKeys[c.id];
  if (Ke && d.wrap && d.wrap.ed){ try { const kr=await decB(Ke, ub64(d.wrap.ed)); c._kdRaw=kr; return (docKeys[c.id]=await importK(kr)); } catch(_){} }
  for (;;){
    const pw=await askPw(c.title||''); if (pw===null) return null;
    try { const kk=await kek(pw, d.wrap.pw.salt, cfg.iter); const kr=await decB(kk, ub64(d.wrap.pw.k)); c._kdRaw=kr; return (docKeys[c.id]=await importK(kr)); }
    catch(_){ toast('문서 비밀번호가 맞지 않습니다.'); }
  }
}

// ── 깃헙 읽기/쓰기. 편집자(토큰 있음)는 API 로 최신본, 뷰어는 raw CDN(몇 분 캐시) ──
const apiUrl = path => `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`;
const rawUrl = path => `https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${GH.branch}/${path}?v=${Date.now()}`;
const authH = extra => Object.assign({Authorization:'Bearer '+token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}, extra||{});
async function ghRead(path){
  if (token){
    const r=await fetch(apiUrl(path)+`?ref=${GH.branch}&v=${Date.now()}`, {headers:authH({Accept:'application/vnd.github.raw+json'}), cache:'no-store'});
    if (r.status===404) return null; if (!r.ok) throw new Error('깃헙 읽기 실패 '+r.status); return new Uint8Array(await r.arrayBuffer());
  }
  const r=await fetch(rawUrl(path), {cache:'no-store'});
  if (r.status===404) return null; if (!r.ok) throw new Error('읽기 실패 '+r.status); return new Uint8Array(await r.arrayBuffer());
}
async function ghSha(path){
  const cut=path.lastIndexOf('/'); const dir=cut>=0?path.slice(0,cut):''; const name=path.slice(cut+1);
  const r=await fetch(apiUrl(dir)+`?ref=${GH.branch}&v=${Date.now()}`, {headers:authH(), cache:'no-store'});
  if (r.status===404) return null; if (!r.ok) throw new Error('깃헙 목록 실패 '+r.status);
  const arr=await r.json(); const f=(Array.isArray(arr)?arr:[]).find(x=>x.name===name); return f?f.sha:null;
}
async function ghWrite(path, u8, message){
  for (let attempt=0; attempt<2; attempt++){
    const sha=await ghSha(path);
    const r=await fetch(apiUrl(path), {method:'PUT', headers:authH({'Content-Type':'application/json'}), body: JSON.stringify(Object.assign({message, content:b64(u8), branch:GH.branch}, sha?{sha}:{}))});
    if (r.ok) return;
    if ((r.status===409||r.status===422) && attempt===0) continue;
    throw new Error('깃헙 쓰기 실패 '+r.status+' '+(await r.text()).slice(0,160));
  }
}
async function ghDelete(path, message){
  const sha=await ghSha(path); if (!sha) return;
  const r=await fetch(apiUrl(path), {method:'DELETE', headers:authH({'Content-Type':'application/json'}), body: JSON.stringify({message, sha, branch:GH.branch})});
  if (!r.ok && r.status!==404) throw new Error('깃헙 삭제 실패 '+r.status);
}

// ── 목록/문서 ──
async function loadIndex(){ const u=await ghRead('docs/index.json'); cases = u ? JSON.parse(td.decode(u)) : []; cases.forEach(c=>{ c.loaded=false; }); }
async function loadDoc(c){
  if (!K) throw new Error('먼저 비밀번호로 열어 주세요');
  const u=await ghRead(`docs/${c.id}.json`); if (!u) throw new Error('문서 파일이 없습니다');
  const d=JSON.parse(td.decode(u));
  let key=K;
  if (d.lock){ key=await docKey(c, d); if (!key) throw new Error('문서 비밀번호가 필요합니다'); c.lock=true; c._wrap=d.wrap; } else { c.lock=false; }
  const payload=JSON.parse(td.decode(await decB(key, ub64(d.ct))));
  Object.assign(c, {title:d.title, date:d.date, type:d.type||'text', source:d.source, client:d.client}, payload);
  if (isPdf(c)){ const pe=await ghRead(`docs/${c.id}.pdf.enc`); if (!pe) throw new Error('PDF 파일이 없습니다'); c.pdf=b64(await decB(key, pe)); }
  c.loaded=true; return c;
}
function meta(c){ return {id:c.id, title:c.title, date:c.date, type:c.type||'text', source:c.source||'', client:c.client||'', n:caseCount(c), lock:!!c.lock}; }
async function updateIndex(fn){
  const u=await ghRead('docs/index.json'); const list=u?JSON.parse(td.decode(u)):[]; fn(list);
  list.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.id||'').localeCompare(a.id||''));
  await ghWrite('docs/index.json', te.encode(JSON.stringify(list)), 'index');
}
async function saveDoc(c, btn){
  const msg=$('#saveMsg'); if (msg){ msg.textContent='저장하는 중…'; msg.className='msg'; } if (btn) btn.disabled=true;
  try {
    if (!token) throw new Error('편집자만 저장할 수 있습니다');
    const payload = isPdf(c) ? {marks:c.marks||[], note:c.note||'', pages:c.pages||0} : {orig:c.orig, rev:c.rev, memos:c.memos||{}, note:c.note||''};
    // 문서 열쇠 정하기: 잠금 없음 = 사이트키 K / 잠금 = 문서키(문서 비밀번호와 편집자키 Ke 로 각각 감쌈)
    let key=K, wrap=null; const wasLocked=!!c.lock; let keyChanged=false;
    if (c.unlockReq){ c.lock=false; keyChanged=wasLocked; }
    else if (c.lockPw){
      if (!Ke) throw new Error('편집자키가 없습니다. 잠갔다가 다시 열어 주세요');
      const kr = (wasLocked && c._kdRaw) ? c._kdRaw : crypto.getRandomValues(new Uint8Array(32));   // 비밀번호만 바꾸면 열쇠는 유지
      keyChanged = !wasLocked;
      const salt=b64(crypto.getRandomValues(new Uint8Array(16))); const kk=await kek(c.lockPw, salt, cfg.iter);
      wrap={pw:{salt, k:b64(await encB(kk, kr))}, ed:b64(await encB(Ke, kr))};
      c._kdRaw=kr; c._wrap=wrap; c.lock=true; key=docKeys[c.id]=await importK(kr);
    } else if (wasLocked){
      key=docKeys[c.id]; wrap=c._wrap; if (!key || !wrap) throw new Error('잠긴 문서의 열쇠가 없습니다. 문서를 다시 열어 주세요');
    }
    c.lockPw=''; c.unlockReq=false;
    const ct = b64(await encB(key, te.encode(JSON.stringify(payload))));
    c.loaded=true; const m=meta(c);
    if (isPdf(c) && (c.pdfDirty || keyChanged)){ if (!c.pdf) throw new Error('PDF 내용이 메모리에 없습니다. 문서를 다시 열어 주세요'); if (msg) msg.textContent='PDF 올리는 중…'; await ghWrite(`docs/${c.id}.pdf.enc`, await encB(key, b64ToBytes(c.pdf)), `pdf: ${c.title}`); c.pdfDirty=false; }
    if (msg) msg.textContent='문서 저장하는 중…';
    await ghWrite(`docs/${c.id}.json`, te.encode(JSON.stringify(Object.assign({}, m, c.lock?{lock:true, wrap}:{}, {ct}))), `save: ${c.title}`);
    await updateIndex(list=>{ const i=list.findIndex(x=>x.id===c.id); if (i>=0) list[i]=m; else list.push(m); });
    const idx=cases.findIndex(x=>x.id===c.id); if (idx>=0){ if (cases[idx]!==c) Object.assign(cases[idx], c); } else cases.push(c);
    const wasDraft=!!view.draft; const y=window.scrollY;
    view.draft=null; view.id=c.id; view.dirty=false; location.hash='case='+c.id; toast('저장했습니다');
    // 저장 뒤 화면을 맨 위로 보내지 않는다: 기존 PDF 문서는 머리만 갱신, 그 외는 다시 그린 뒤 같은 자리로
    if (!wasDraft && isPdf(c)){ refreshPdfHead(c); restoreSpot(y); }
    else { pendingSpot={y}; render(); if (!isPdf(c)){ pendingSpot=null; restoreSpot(y); } }
    return true;
  } catch(e){ if (msg){ msg.textContent=(e&&e.message)||String(e); msg.className='msg err'; } if (btn) btn.disabled=false; toast('저장 실패: '+((e&&e.message)||e)); return false; }
}
async function deleteDoc(c, btn){
  const msg=$('#saveMsg'); if (msg){ msg.textContent='지우는 중…'; msg.className='msg'; } if (btn) btn.disabled=true;
  try {
    await ghDelete(`docs/${c.id}.json`, `delete: ${c.title}`);
    if (isPdf(c)) await ghDelete(`docs/${c.id}.pdf.enc`, `delete pdf: ${c.title}`);
    await updateIndex(list=>{ const i=list.findIndex(x=>x.id===c.id); if (i>=0) list.splice(i,1); });
    cases=cases.filter(x=>x.id!==c.id); view={mode:'list',id:null,draft:null,dirty:false,show:'side'}; location.hash=''; toast('지웠습니다'); render();
  } catch(e){ if (msg){ msg.textContent=(e&&e.message)||String(e); msg.className='msg err'; } if (btn) btn.disabled=false; }
}

// ── 저장 뒤 원래 자리·커서 복원 ──
let lastNoteFocus=null, pendingSpot=null;
document.addEventListener('focusin', e=>{ const n=e.target.closest && e.target.closest('.note'); if (n){ lastNoteFocus={noteId:n.id, sel: e.target.classList.contains('md') ? '.md' : e.target.classList.contains('after') ? 'textarea.after' : 'textarea:not([hidden]), .md'}; saveSpot(); } });
let spotT=null;
function saveSpot(){ clearTimeout(spotT); spotT=setTimeout(()=>{ try { if (view.mode==='case' && view.id) sessionStorage.setItem('redpen.spot', JSON.stringify({id:view.id, y:window.scrollY, f:lastNoteFocus})); } catch(e){} }, 150); }
window.addEventListener('scroll', saveSpot, {passive:true});
function restoreSpot(y){
  requestAnimationFrame(()=>{ window.scrollTo(0, y);
    if (lastNoteFocus){ const n=document.getElementById(lastNoteFocus.noteId); const f=n && n.querySelector(lastNoteFocus.sel); if (f){ f.focus({preventScroll:true}); if (f.isContentEditable){ const r=document.createRange(); r.selectNodeContents(f); r.collapse(false); const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r); } } }
    requestAnimationFrame(()=>window.scrollTo(0, y));
  });
}

// ── 잠금/열기 ──
async function loadConfig(){ const u=await ghRead('config.json'); if (!u) throw new Error('config.json 이 없습니다'); cfg=JSON.parse(td.decode(u)); }
async function tryUnlock(pw){
  const key=await kek(pw, cfg.salt, cfg.iter);
  try { const kr=await decB(key, ub64(cfg.editor.k)); const t=td.decode(await decB(key, ub64(cfg.editor.t))); Kraw=kr; K=await importK(kr); token=t; role='editor'; Ke=await deriveKe(kr, t); return true; } catch(_){}
  try { const kr=await decB(key, ub64(cfg.viewer.k)); Kraw=kr; K=await importK(kr); token=null; role='viewer'; return true; } catch(_){}
  return false;
}
function saveSess(remember){
  const v=JSON.stringify({role, k:b64(Kraw), t:token});
  try { sessionStorage.setItem('redpen.sess', v); if (remember) localStorage.setItem('redpen.sess', v); else localStorage.removeItem('redpen.sess'); } catch(e){}
}
function lockScreen(){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='ask lock';
    ov.innerHTML=`<form class="box" role="dialog" aria-modal="true"><h3>쑤닐의 퇴고장</h3><p>비밀번호를 넣으세요. 뷰어 비밀번호는 읽기만, 편집자 비밀번호는 저장까지 됩니다.</p>
      <input type="password" id="pwIn" autocomplete="current-password" placeholder="비밀번호">
      <label class="rm"><input type="checkbox" id="pwRemember"> 이 브라우저에 기억</label>
      <div class="msg err" id="pwErr"></div>
      <div class="row"><button class="btn primary" type="submit">열기</button></div></form>`;
    document.body.appendChild(ov); const inp=ov.querySelector('#pwIn'); inp.focus();
    ov.querySelector('form').addEventListener('submit', async e=>{
      e.preventDefault(); const btn=ov.querySelector('button'); btn.disabled=true; ov.querySelector('#pwErr').textContent='확인하는 중…';
      const ok=await tryUnlock(inp.value);
      if (ok){ saveSess(ov.querySelector('#pwRemember').checked); ov.remove(); res(); }
      else { ov.querySelector('#pwErr').textContent='비밀번호가 맞지 않습니다.'; btn.disabled=false; inp.select(); }
    });
  });
}
function lockNow(){ try { sessionStorage.removeItem('redpen.sess'); localStorage.removeItem('redpen.sess'); } catch(e){} location.hash=''; location.reload(); }
async function changePasswords(){
  const ov=document.createElement('div'); ov.className='ask';
  ov.innerHTML=`<form class="box" role="dialog" aria-modal="true"><h3>비밀번호 바꾸기</h3><p>비워 두면 그대로 둡니다. 바꾼 비밀번호는 다른 사람에게 다시 알려 줘야 합니다.</p>
    <label class="l">새 뷰어 비밀번호</label><input type="password" id="pwV" autocomplete="new-password">
    <label class="l">새 편집자 비밀번호</label><input type="password" id="pwE" autocomplete="new-password">
    <div class="msg err" id="pwErr2"></div>
    <div class="row"><button class="btn" type="button" id="pwCancel">취소</button><button class="btn primary" type="submit">바꾸기</button></div></form>`;
  document.body.appendChild(ov); ov.querySelector('#pwV').focus();
  ov.querySelector('#pwCancel').addEventListener('click', ()=>ov.remove());
  ov.querySelector('form').addEventListener('submit', async e=>{
    e.preventDefault(); const nv=ov.querySelector('#pwV').value, ne=ov.querySelector('#pwE').value; const err=ov.querySelector('#pwErr2');
    if (!nv && !ne){ ov.remove(); return; }
    if ((nv && nv.length<8) || (ne && ne.length<8)){ err.textContent='8자 이상으로 해 주세요.'; return; }
    if (nv && ne && nv===ne){ err.textContent='뷰어와 편집자 비밀번호는 달라야 합니다.'; return; }
    err.textContent='바꾸는 중…';
    try {
      // 현재 비밀번호를 모르는 쪽은 기존 봉투를 그대로 두되, salt 를 바꾸면 둘 다 다시 싸야 하므로 salt 는 유지한다
      const c2=JSON.parse(JSON.stringify(cfg));
      if (nv){ const kv=await kek(nv, cfg.salt, cfg.iter); c2.viewer={k:b64(await encB(kv, Kraw))}; }
      if (ne){ const ke=await kek(ne, cfg.salt, cfg.iter); c2.editor={k:b64(await encB(ke, Kraw)), t:b64(await encB(ke, te.encode(token)))}; }
      await ghWrite('config.json', te.encode(JSON.stringify(c2)), 'passwords'); cfg=c2; ov.remove(); toast('비밀번호를 바꿨습니다');
    } catch(ex){ err.textContent=(ex&&ex.message)||String(ex); }
  });
}
function applyRole(){
  artifactNs = role==='editor' ? {} : null;
  $('#btnSel').hidden = !artifactNs;
  $('#btnNew').hidden = !artifactNs; $('#btnPw').hidden = !artifactNs;
  $('#whoami').textContent = role==='editor' ? '편집자' : '뷰어';
}
async function boot(){
  try { await loadConfig(); } catch(e){ $('#main').innerHTML=`<div class="head"><p class="msg err">설정 파일을 읽지 못했습니다: ${esc((e&&e.message)||e)}</p></div>`; return; }
  let sess=null; try { sess=JSON.parse(sessionStorage.getItem('redpen.sess')||localStorage.getItem('redpen.sess')||'null'); } catch(e){}
  let spot=null;
  if (sess && sess.role && sess.k){ role=sess.role; token=sess.t||null; Kraw=ub64(sess.k); K=await importK(Kraw); if (token) Ke=await deriveKe(Kraw, token);
    try { spot=JSON.parse(sessionStorage.getItem('redpen.spot')||'null'); } catch(e){} }
  else { await lockScreen(); try { sessionStorage.removeItem('redpen.spot'); } catch(e){} }
  applyRole();
  try { await loadIndex(); } catch(e){ toast('목록을 읽지 못했습니다: '+((e&&e.message)||e)); }
  const m=location.hash.match(/case=([\w-]+)/);
  if (m && cases.some(c=>c.id===m[1])) view={mode:'case', id:m[1], draft:null, dirty:false, show:'side'};
  if (spot && view.mode==='case' && spot.id===view.id){ lastNoteFocus=spot.f||null; pendingSpot={y:spot.y||0}; }   // 새로고침: 마지막 자리로
  render();
}

// ══════════════ 공통 ══════════════
// 샌드박스 iframe에서는 브라우저 확인창이 열리지 않고 곧장 취소로 떨어지므로 자체 확인창을 쓴다
function ask(msg, okLabel){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='ask';
    ov.innerHTML=`<div class="box" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="row"><button class="btn" data-v="0">취소</button><button class="btn primary" data-v="1">${esc(okLabel||'확인')}</button></div></div>`;
    const done=v=>{ ov.remove(); document.removeEventListener('keydown', onKey); res(v); };
    const onKey=e=>{ if (e.key==='Escape') done(false); if (e.key==='Enter') done(true); };
    ov.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>done(b.dataset.v==='1')));
    ov.addEventListener('mousedown', e=>{ if (e.target===ov) done(false); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov); ov.querySelector('.primary').focus();
  });
}
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'), 2200); }
async function copyText(t, ok){
  try { await navigator.clipboard.writeText(t); toast(ok); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(ok);}catch(_){ toast('복사가 막혀 있습니다. 직접 선택해 복사해 주세요.'); } ta.remove(); }
}
$('#btnList').addEventListener('click', async ()=>{ if (!(await leaveOk())) return; view={mode:'list',id:null,draft:null,dirty:false,show:'side'}; location.hash=''; render(); });
$('#btnNew').addEventListener('click', async ()=>{ if (!(await leaveOk())) return; view={mode:'edit',id:null,draft:null,dirty:false,show:'side'}; render(); });
const shell=$('.shell');
const syncFold=()=>{ $('#btnRail').textContent = shell.classList.contains('nrail') ? '목록 펼치기 »' : '« 접기'; };
const syncTop=()=>{ document.documentElement.style.setProperty('--top-h', $('.top').offsetHeight+'px'); };
syncTop(); window.addEventListener('resize', syncTop);
// 글꼴이 늦게 로드되면 상단 바 높이가 바뀌어 목록·머리가 그 밑으로 들어간다 → 높이 변화를 계속 감시
if (window.ResizeObserver) new ResizeObserver(syncTop).observe($('.top'));
if (document.fonts) document.fonts.ready.then(syncTop);
window.addEventListener('load', syncTop);
try { if (localStorage.getItem('redpen.nrail')==='1') shell.classList.add('nrail'); } catch(e){}
syncFold();
$('#btnRail').addEventListener('click', e=>{ e.stopPropagation(); shell.classList.toggle('nrail'); syncFold(); try { localStorage.setItem('redpen.nrail', shell.classList.contains('nrail')?'1':'0'); } catch(e){}
  requestAnimationFrame(()=>{ layoutNotes(); if (pdfState && $('#doc')) drawPages(); }); });
let rsT=null, lastW=window.innerWidth;
window.addEventListener('resize', ()=>{ layoutNotes(); clearTimeout(rsT); rsT=setTimeout(()=>{ if (pdfState && $('#doc') && Math.abs(window.innerWidth-lastW)>10){ lastW=window.innerWidth; drawPages(); } }, 250); });
window.addEventListener('beforeunload', e=>{ if (view.dirty){ e.preventDefault(); e.returnValue=''; } });
document.fonts && document.fonts.ready.then(()=>layoutNotes());

$('#btnLock').addEventListener('click', lockNow);
// 화면 글자 크기(문서 제외)
let uiScale=1; try { uiScale=parseFloat(localStorage.getItem('redpen.ui'))||1; } catch(e){}
function applyUi(){ document.documentElement.style.setProperty('--ui', uiScale); $('#uiReset').textContent=Math.round(uiScale*100)+'%'; try { localStorage.setItem('redpen.ui', uiScale); } catch(e){} syncTop(); layoutNotes(); fitOverall(); if (pdfState && $('#doc')) drawPages(); }
function setUi(d, reset){ uiScale = reset ? 1 : Math.min(1.6, Math.max(0.8, Math.round((uiScale+d)*10)/10)); applyUi(); }
$('#uiMinus').addEventListener('click', ()=>setUi(-0.1)); $('#uiPlus').addEventListener('click', ()=>setUi(0.1)); $('#uiReset').addEventListener('click', ()=>setUi(0,true));
document.documentElement.style.setProperty('--ui', uiScale); $('#uiReset').textContent=Math.round(uiScale*100)+'%';

$('#brand').addEventListener('click', ()=>$('#btnList').click());
$('#brand').addEventListener('keydown', e=>{ if (e.key==='Enter') $('#btnList').click(); });
$('#btnSel').addEventListener('click', ()=>{ selMode=!selMode; lastSel=-1; if (!selMode) selIds.clear(); renderList(); });
$('#selAll').addEventListener('click', ()=>{ if (selIds.size===cases.length) selIds.clear(); else cases.forEach(c=>selIds.add(c.id)); renderList(); });
$('#selDel').addEventListener('click', async ()=>{ const ids=[...selIds]; if (!ids.length) return;
  if (!(await ask(`선택한 ${ids.length}건을 지웁니다. 되돌릴 수 없습니다.`,'모두 지우기'))) return; selMode=false; await deleteMany(ids); });
$('#btnPw').addEventListener('click', changePasswords);
$('#btnNew').hidden = true; $('#btnPw').hidden = true;
render();
boot();
})();
</script>
