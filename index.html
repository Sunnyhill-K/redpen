<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쑤닐의 퇴고장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ui:1;
  --paper:#FAFAF7; --paper-2:#F1F2ED; --paper-3:#E6E8E1;
  --ink:#1F2430; --ink-2:#5B6270; --ink-3:#8A909B;
  --rule:#C3D6CA; --rule-strong:#5E8F72;
  --del:#C4342D; --del-bg:#FBE9E7; --del-line:#E39A95;
  --ins:#2D5BB9; --ins-bg:#E7EEFB; --ins-line:#9DB6EA;
  --memo:#2E7D4F; --memo-bg:#E4F1E8;
  --btn:#1F2430; --btn-ink:#FAFAF7;
  --focus:#2D5BB9;
  --serif:"Noto Serif KR",AppleMyungjo,"Nanum Myeongjo",Batang,serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15181D; --paper-2:#1B1F26; --paper-3:#252A33;
    --ink:#E7E5DE; --ink-2:#A9AEB8; --ink-3:#7C828D;
    --rule:#2E463A; --rule-strong:#6FA98A;
    --del:#F0776E; --del-bg:#3A2321; --del-line:#8C3F3A;
    --ins:#86ACF2; --ins-bg:#1D2A45; --ins-line:#3E5A96;
    --memo:#7FC49A; --memo-bg:#1E3327;
    --btn:#E7E5DE; --btn-ink:#15181D;
    --focus:#86ACF2;
  }
}
:root[data-theme="dark"]{
  --paper:#15181D; --paper-2:#1B1F26; --paper-3:#252A33;
  --ink:#E7E5DE; --ink-2:#A9AEB8; --ink-3:#7C828D;
  --rule:#2E463A; --rule-strong:#6FA98A;
  --del:#F0776E; --del-bg:#3A2321; --del-line:#8C3F3A;
  --ins:#86ACF2; --ins-bg:#1D2A45; --ins-line:#3E5A96;
  --memo:#7FC49A; --memo-bg:#1E3327;
  --btn:#E7E5DE; --btn-ink:#15181D;
  --focus:#86ACF2;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:calc(14px * var(--ui,1));line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--ins)}

/* ── 상단 바 ── */
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:calc(8px + .2em);margin-right:auto;cursor:pointer}
.brand h1{font-family:var(--serif);font-weight:600;font-size:calc(24px * var(--ui,1));margin:0;letter-spacing:.02em}
.brand .sub{color:var(--ink-3);font-size:calc(12px * var(--ui,1))}
.pen{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--del);transform:translateY(-1px)}
.btn{border:1px solid var(--ink-2);background:transparent;border-radius:4px;padding:6px 12px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--del);border-color:var(--del-line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:3px 8px;font-size:calc(12px * var(--ui,1))}

/* ── 본체 ── */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 50px)}
.shell.nrail{grid-template-columns:44px minmax(0,1fr)}
.shell.nrail .rail{padding-block:10px;padding-inline:6px}
.shell.nrail .rail h2{margin:0;justify-content:center}
.shell.nrail .rail .t,.shell.nrail .cases,.shell.nrail .empty,.shell.nrail #btnSel,.shell.nrail .selbar{display:none}
.rail h2{display:flex;align-items:center;gap:6px;margin:0}
.rail h2 .fold,.railbtns .fold{margin:0;border:1px solid var(--ink-2);background:transparent;cursor:pointer;color:var(--ink);font-size:calc(12px * var(--ui,1));letter-spacing:0;text-transform:none;font-weight:400;line-height:1.2;padding:3px 8px;border-radius:4px;white-space:nowrap}
.rail h2 .fold:hover{background:var(--paper-3);color:var(--ink);border-color:var(--ink)}
.shell.nrail .railbtns .fold{margin:0;writing-mode:vertical-rl;padding:12px 7px;font-size:calc(12.5px * var(--ui,1));letter-spacing:.06em}
.zoom{display:inline-flex;align-items:center;border:1px solid var(--ink-2);border-radius:4px;overflow:hidden;font-size:calc(12px * var(--ui,1))}
.zoom button{border:0;background:transparent;padding:3px 9px;cursor:pointer;border-right:1px solid var(--ink-2);line-height:1.3}
.zoom button:last-child{border-right:0}
.zoom button:hover{background:var(--paper-2)}
.zoom .z{font-family:var(--mono);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.rail{border-right:1px solid var(--rule);background:var(--paper-2);padding-block:12px;padding-inline:0;position:sticky;top:var(--top-h,50px);left:0;height:calc(100vh - var(--top-h,50px));overflow-y:auto;align-self:start;z-index:6}
.rail h2{font-size:calc(11px * var(--ui,1));letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 16px 8px;font-weight:600}
.cases{list-style:none;margin:0;padding:0}
.cases li{padding:10px 34px 10px 16px;border-left:3px solid transparent;cursor:pointer;position:relative}
.cases li .more{position:absolute;right:8px;top:8px;border:0;background:transparent;color:var(--ink-3);font-size:calc(16px * var(--ui,1));line-height:1;padding:2px 6px;border-radius:3px;cursor:pointer;opacity:0}
.cases li:hover .more,.cases li .more:focus-visible{opacity:1}
.cases li .more:hover{background:var(--paper-3);color:var(--ink)}
.cases li.sel{padding-left:12px;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:start}
.cases li.sel .ck{margin:3px 0 0;grid-row:1/3}
.cases li.sel .t{grid-column:2} .cases li.sel .m{grid-column:2}
.railhead{display:flex;align-items:flex-start;justify-content:space-between;padding:0 12px 6px}
.railrow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 12px 8px;flex-wrap:nowrap}
.railrow .btn.small{white-space:nowrap}
.sorts{display:inline-flex;gap:3px}
.railrow .btn.small{padding:3px 6px}
.sorts .btn.small.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.shell.nrail .railrow{display:none}
.railhead h2{margin:0;padding-top:4px}
.railbtns{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.railbtns .btn.small,.railbtns .fold{margin:0}
.shell.nrail .railhead{padding:0;justify-content:center}
.shell.nrail .railbtns{align-items:center}
.selbar{padding:0 12px 8px;display:flex;gap:6px}
.imenu{position:fixed;z-index:30;background:var(--paper);border:1px solid var(--rule);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;flex-direction:column;min-width:140px;padding:4px}
.imenu button{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:3px;cursor:pointer}
.imenu button:hover{background:var(--paper-2)}
.imenu button.d{color:var(--del)}
.cases li:hover{background:var(--paper-3)}
.cases li.on{border-left-color:var(--del);background:var(--paper)}
.cases .t{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cases .m{color:var(--ink-3);font-size:calc(12px * var(--ui,1));display:flex;gap:6px;margin-top:2px;font-variant-numeric:tabular-nums;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;align-items:center}
.chip{display:inline-block;font-size:calc(11px * var(--ui,1));padding:1px 6px;border-radius:3px;background:var(--paper-3);color:var(--ink-2);line-height:1.5}
.chip.pdf{background:var(--del-bg);color:var(--del)}
.chip.last{background:var(--ins-bg);color:var(--ins)}
.empty{padding:16px;color:var(--ink-3);font-size:calc(13px * var(--ui,1))}

main{padding-block:0 60px;padding-inline:20px;min-width:0}
body.zoomed-body .top{left:0;width:var(--vw,100vw)}
.shell{--rail-w:240px}
.shell.nrail{--rail-w:44px}

/* 배율과 무관하게 항상 왼쪽 정렬(100%일 때만 가운데로 튀지 않게) */
.head,.sheet,.overall,.edit,.mlist{margin-left:0!important;margin-right:0!important}

/* ── 사건 머리 ── */
.head{max-width:none;margin:0 0 18px;position:sticky;top:var(--top-h,50px);z-index:4;background:var(--paper);padding-top:16px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.head .hint{margin-top:8px}
body.zoomed-body .head{left:calc(var(--rail-w,240px) + 20px);width:calc(var(--vw,100vw) - var(--rail-w,240px) - 40px);max-width:none}
body.zoomed-body .head::before{content:'';position:absolute;left:-20px;top:0;bottom:-1px;width:20px;background:var(--paper);border-bottom:1px solid var(--rule)}   /* 가로 스크롤 때 머리는 목록 오른쪽부터 창 끝까지, 그 밑으로 문서가 지나간다 */
.head .eyebrow{font-size:calc(12px * var(--ui,1));color:var(--ink-3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.head h2{font-family:var(--serif);font-size:calc(24px * var(--ui,1));font-weight:600;margin:4px 0 6px;text-wrap:balance;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h2 .hbtns{display:inline-flex;gap:6px;font-family:var(--sans);font-weight:400}
.stats{display:flex;gap:18px;font-family:var(--mono);font-size:calc(12px * var(--ui,1));color:var(--ink-2);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats b{font-weight:500;color:var(--ink)}
.stats .d b{color:var(--del)} .stats .i b{color:var(--ins)} .stats .m b{color:var(--memo)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--ink-2);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;border-right:1px solid var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.spacer{flex:1}
.pager{display:inline-flex;align-items:center;border:1px solid var(--ink-2);border-radius:4px;overflow:hidden;font-family:var(--mono);font-size:calc(12px * var(--ui,1));font-variant-numeric:tabular-nums}
.pager button{border:0;background:transparent;padding:3px 8px;cursor:pointer;font-size:calc(14px * var(--ui,1));line-height:1.2}
.pager button:hover{background:var(--paper-2)}
.pager input{width:40px;border:0;border-left:1px solid var(--ink-2);background:transparent;text-align:center;padding:3px 2px;font-family:var(--mono);font-size:calc(12px * var(--ui,1))}
.pager input:focus{outline:none;background:var(--ins-bg)}
.pager .sl{color:var(--ink-3);padding:0 3px}
.pager b{font-weight:500;padding-right:4px;border-right:1px solid var(--ink-2);padding-left:1px;line-height:1.9}
.hint{font-size:calc(12px * var(--ui,1));color:var(--ink-3)}

/* ── 원고 + 여백 메모 ── */
.sheet{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) calc(280px * var(--ui,1));gap:28px;position:relative}
.doc{font-family:var(--serif);font-size:calc(16.5px * var(--z,1));line-height:1.95;max-width:70ch;padding:22px 26px 22px 30px;background:var(--paper);border:1px solid var(--rule);border-left:2px solid var(--rule-strong);border-radius:2px;
  box-shadow:inset 4px 0 0 var(--paper),inset 5px 0 0 var(--rule)}
.doc p{margin:0 0 .35em}
.doc p.gap{margin-top:1.3em}
.doc p.hd{font-weight:600;margin-top:1.4em}
.doc p.hd:first-child{margin-top:0}
del{color:var(--del);text-decoration:line-through;text-decoration-thickness:1.5px;background:var(--del-bg);border-radius:2px;padding:0 1px}
ins{color:var(--ins);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;background:var(--ins-bg);border-radius:2px;padding:0 1px}
.mk{display:inline-block;font-family:var(--mono);font-size:calc(10.5px * var(--ui,1));line-height:1;vertical-align:super;color:var(--del);border:1px solid var(--del-line);border-radius:8px;padding:2px 4px;margin:0 2px 0 1px;cursor:pointer;user-select:none;background:var(--paper)}
.mk:hover,.mk.hot{background:var(--del);color:#fff}
.hunk.hot del{outline:2px solid var(--del-line)} .hunk.hot ins{outline:2px solid var(--ins-line)}

.notes{position:relative;font-size:calc(14.5px * var(--ui,1))}
.note{position:absolute;left:0;right:0;border-left:2px solid var(--del-line);padding:2px 0 2px 10px;transition:top .15s}
.note.memo{border-left-color:var(--memo)}
.note .n{font-family:var(--mono);font-size:calc(12px * var(--ui,1));color:var(--del);display:flex;gap:6px;align-items:center;margin-bottom:.7em}
.note.memo .n{color:var(--memo)}
.note .n .k{color:var(--ink-3);font-family:var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.note .n .x{border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:0 2px;font-size:calc(13px * var(--ui,1));line-height:1}
.note .n .x:hover{color:var(--del)}
.note textarea{width:100%;border:0;border-bottom:1px dashed var(--rule);background:transparent;resize:none;padding:2px 0;line-height:1.5;min-height:22px;font-size:calc(14.5px * var(--ui,1));overflow:hidden}
.note textarea:focus{border-bottom-color:var(--focus);outline:none}
.note textarea.after{color:var(--ins);font-family:var(--serif)}
.note .txt{white-space:pre-wrap;line-height:1.5;color:var(--ink)}
.md{cursor:text;min-height:22px;border-bottom:1px dashed var(--rule);outline:none;white-space:pre-wrap}
.md:focus{border-bottom-color:var(--focus)}
.md b{font-weight:600}
.md:empty::before{content:attr(data-ph);color:var(--ink-3)}
.md code,.mlist code{font-family:var(--mono);font-size:.92em;background:var(--paper-3);padding:0 3px;border-radius:2px}
.md u{text-decoration-thickness:1px;text-underline-offset:2px}
.md s{color:var(--ink-3)}
.note .txt.after{color:var(--ins);font-family:var(--serif)}
.note .txt.after::before{content:"→ "}
.note .txt:empty::before{content:"메모 없음";color:var(--ink-3)}
.note .lbl{font-size:calc(10px * var(--ui,1));color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.note.hot{border-left-color:var(--del)}
.notes-title{font-size:calc(11px * var(--ui,1));letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;font-weight:600;position:absolute;top:-22px}
@media (prefers-reduced-motion: reduce){.note{transition:none}}

/* 좌우 비교: 원문 | 수정본 | 메모 */
.sheet.three{max-width:1480px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) calc(240px * var(--ui,1));gap:18px}
.sheet.three .doc{max-width:none;font-size:calc(15px * var(--z,1));line-height:1.85;padding:18px 18px 18px 22px}
.sheet .lab{font-family:var(--sans);font-size:calc(11px * var(--ui,1));letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;font-weight:600;display:flex;gap:10px}
.sheet .lab .d{color:var(--del)} .sheet .lab .i{color:var(--ins)}
.sheet.three .notes{font-size:calc(14px * var(--ui,1));padding-top:0}
.sheet.three .notes-title{position:static;margin-top:0}
@media (max-width:1240px){
  .sheet.three{grid-template-columns:1fr 1fr}
  .sheet.three .notes{grid-column:1/-1;position:static;columns:2;column-gap:24px}
  .sheet.three .note{position:static;margin:0 0 10px;break-inside:avoid}
}

/* ── 텍스트·Word 원문 위 표시 ── */
.txtdoc{max-width:none;position:relative;line-height:1.9}
.txtdoc .pre{white-space:pre-wrap;word-break:break-word}
.txtdoc.word h1,.txtdoc.word h2,.txtdoc.word h3{font-family:var(--sans);line-height:1.35;margin:1.2em 0 .5em}
.txtdoc.word h1{font-size:1.45em} .txtdoc.word h2{font-size:1.25em} .txtdoc.word h3{font-size:1.1em}
.txtdoc.word p{margin:0 0 .7em} .txtdoc.word ul,.txtdoc.word ol{padding-left:1.6em;margin:0 0 .7em}
.txtdoc.word table{border-collapse:collapse;margin:.6em 0;font-size:.92em;line-height:1.5}
.txtdoc.word td,.txtdoc.word th{border:1px solid var(--rule);padding:4px 8px;vertical-align:top}
.txtdoc .hunk{border-radius:2px;padding:0 1px}
.txtdoc .t-del,.txtdoc .t-rep{color:var(--del);text-decoration:line-through;text-decoration-thickness:1.5px;background:var(--del-bg)}
.txtdoc .t-memo{background:var(--memo-bg);text-decoration:underline;text-decoration-color:var(--memo);text-decoration-thickness:1.5px;text-underline-offset:3px}
.txtdoc .hunk.hot{outline:2px solid var(--del-line)}
.txtdoc ins{color:var(--ins);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;background:var(--ins-bg);border-radius:2px;padding:0 1px}
.hide-marks .txtdoc .hunk{color:inherit;text-decoration:none;background:transparent}
.hide-marks .txtdoc .mk{display:none}
.txtdoc .pop{position:absolute}

/* ── PDF 문서형: 쪽을 원본 그대로 그리고 그 위에 표시 ── */
.sheet.pdf{max-width:1180px;grid-template-columns:minmax(0,1fr) calc(280px * var(--ui,1))}
/* 확대 시: 틀이 쪽 크기만큼 넓어지고, 화면을 넘치면 main 이 가로로 움직인다 */
.sheet.pdf.zoomed{max-width:none;width:max-content;grid-template-columns:auto calc(280px * var(--ui,1))}
.sheet.pdf .txtdoc{width:auto;max-width:none;min-width:0;background:var(--paper-3);padding:14px;border:0;box-shadow:none;border-radius:3px}
.txtdoc .tpage{background:#fff;color:#1F2430;box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);padding:34px 38px;min-height:300px}
.txtdoc .tpage .pre{color:inherit}
.sheet.pdf.zoomed .pages{overflow:visible;max-width:none}
.sheet.pdf .notes-title{position:static;margin-bottom:8px}
.pages{display:flex;flex-direction:column;gap:18px;position:relative;overflow:auto;max-width:100%;background:var(--paper-3);padding:14px;border-radius:3px}
.page{position:relative;width:100%;margin:0 auto;flex:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);overflow:hidden}
.page canvas{display:block;width:100%;height:auto}
.page .pno{position:absolute;right:8px;bottom:6px;font-family:var(--mono);font-size:calc(10px * var(--ui,1));color:#8A909B;pointer-events:none;z-index:4}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;opacity:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:rgba(45,91,185,.35)}
.textLayer.ocr .oline{position:absolute;color:transparent;white-space:pre;transform-origin:0 0;cursor:text;font-family:Arial,sans-serif;letter-spacing:0}
.textLayer.ocr.show .oline{color:rgba(196,52,45,.75);outline:1px solid rgba(196,52,45,.5)}
.marks{position:absolute;inset:0;z-index:3;pointer-events:none}
/* 쪽은 항상 흰 종이이므로 표시 색은 고정값 */
.mbox{position:absolute;border-radius:1px}
.mbox.del,.mbox.rep{background:linear-gradient(to bottom,rgba(196,52,45,.10) 0,rgba(196,52,45,.10) calc(50% - 1px*var(--pz,1)),#C4342D calc(50% - 1px*var(--pz,1)),#C4342D calc(50% + 1px*var(--pz,1)),rgba(196,52,45,.10) calc(50% + 1px*var(--pz,1)))}
.mbox.memo{background:linear-gradient(to bottom,rgba(46,125,79,.10) 0,rgba(46,125,79,.10) calc(100% - 2px*var(--pz,1)),#2E7D4F calc(100% - 2px*var(--pz,1)))}
.mbox.hot{outline:2px solid rgba(196,52,45,.5)}
.mbox.area{background:rgba(196,52,45,.08)!important;border:2px dashed #C4342D;border-radius:3px;box-sizing:border-box}

.ask .box.users{max-width:640px}

<body>
<header class="top">
  <div class="brand" id="brand" role="link" tabindex="0" title="홈으로"><span class="pen"></span><h1>쑤닐의 퇴고장</h1></div>
  <span id="whoami" class="chip"></span>
  <button class="btn" id="btnUsers" hidden>사용자 관리</button>
  <button class="btn" id="btnPw" hidden>비밀번호 바꾸기</button>
  <span class="zoom" title="화면 글자 크기 (문서 제외)"><button id="uiMinus" aria-label="글자 작게">가−</button><button class="z" id="uiReset" title="기본으로">100%</button><button id="uiPlus" aria-label="글자 크게">가+</button></span>
  <button class="btn" id="btnLock">로그아웃</button>
  <button class="btn" id="btnList">홈</button>
  <button class="btn primary" id="btnNew" title="Alt+N">새 퇴고</button>
</header>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="railhead"><h2 id="railTitle"><span class="t">목록</span></h2><div class="railbtns"><button class="fold" id="btnRail" title="목록 접기/펼치기" aria-label="목록 접기/펼치기">« 접기</button></div></div>
    <div class="railrow"><span class="sorts"><button class="btn small" id="sortDate" title="날짜순 · 누르면 최신↔오래된">최신순</button><button class="btn small" id="sortName" title="이름순 · 누르면 AZ↔ZA">이름 AZ</button></span><button class="btn small" id="btnSel" hidden>다수 선택</button></div>
    <div class="selbar" id="selBar" hidden><button class="btn small danger" id="selDel">선택 삭제 (0)</button><button class="btn small" id="selAll">전체</button></div>
    <ul class="cases" id="caseList"></ul>
    <div class="empty" id="caseEmpty" hidden>아직 문서가 없습니다. 「새 퇴고」로 시작하세요.</div>
  </aside>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND = {del:'삭제', rep:'바꾸기', memo:'메모'};
const fmtN = n => (Number(n)||0).toLocaleString('ko-KR');   // 화면에 보이는 숫자는 천 단위 쉼표

let cases = [];   // docs/index.json 의 메타. 문서를 열면 복호화된 내용이 같은 객체에 합쳐진다(loaded=true)

let artifactNs = null;   // 편집자면 {} (저장 버튼 표시 플래그로만 쓴다)
let view = {mode:'list', id:null, draft:null, dirty:false, show:'side'};
const isPdf = c => c && c.type==='pdf';

const norm = s => s.replace(/\s+/g,' ').trim();
const isText = c => c && !isPdf(c);

// ══════════════ 목록/라우팅 ══════════════
function caseCount(c){ if (!c.loaded) return c.n||0; return (c.marks||[]).length; }
function renderList(){
  const ul=$('#caseList'); ul.innerHTML=''; tmark('목록 그리기');
  $('#caseEmpty').hidden = cases.filter(canSee).length>0;
  const when = c => c.ts || c.date || '';
  const byName = (a,b)=>(a.title||'').localeCompare(b.title||'','ko');
  const byDate = (a,b)=>when(a).localeCompare(when(b)) || (a.id||'').localeCompare(b.id||'');
  const cmp = sortMode==='nameAsc' ? byName : sortMode==='nameDesc' ? (a,b)=>byName(b,a) : sortMode==='old' ? byDate : (a,b)=>byDate(b,a);
  const sd=$('#sortDate'), sn=$('#sortName');
  if (sd){ sd.textContent = sortMode==='old' ? '오래된순' : '최신순'; sd.classList.toggle('on', sortMode==='new'||sortMode==='old'); }
  if (sn){ sn.textContent = sortMode==='nameDesc' ? '이름 ZA' : '이름 AZ'; sn.classList.toggle('on', sortMode==='nameAsc'||sortMode==='nameDesc'); }
  [...cases].filter(canSee).sort(cmp).forEach(c=>{
    const li=document.createElement('li'); li.className = (view.mode==='case' && view.id===c.id) ? 'on' : ''; li.title = c.title||''; li.dataset.id=c.id;
    if (selMode) li.classList.add('sel');
    li.innerHTML = (selMode ? `<input type="checkbox" class="ck" ${selIds.has(c.id)?'checked':''}>` : '') + (artifactNs && !selMode ? `<button class="more" title="정보 수정 · 삭제">…</button>` : '') + `<span class="t">${esc(c.title||'(제목 없음)')}</span><span class="m"><span>${esc(fmtWhen(c))}</span><span class="chip ${isPdf(c)?'pdf':''}">${isPdf(c)?'PDF':(c.type==='word'?'Word':'텍스트')}</span>${c.lock?'<span title="문서 비밀번호 있음">🔒</span>':''}<span>${fmtN(caseCount(c))}곳</span></span>`;
    li.addEventListener('click', e=>{
      if (selMode){
        const items=[...ul.querySelectorAll('li')]; const idx=items.indexOf(li);
        if (e.shiftKey && lastSel>=0){   // Shift+클릭 = 범위 선택
          const [a,b]=[Math.min(lastSel,idx), Math.max(lastSel,idx)];
          items.slice(a,b+1).forEach(x=>{ selIds.add(x.dataset.id); x.querySelector('.ck').checked=true; });
          getSelection().removeAllRanges();
        } else { if (selIds.has(c.id)) selIds.delete(c.id); else selIds.add(c.id); li.querySelector('.ck').checked=selIds.has(c.id); }
        lastSel=idx; syncSelBar(); return; }
      openCase(c.id);
    });
    const mb=li.querySelector('.more'); if (mb) mb.addEventListener('click', e=>{ e.stopPropagation(); showItemMenu(mb, c); });
    ul.appendChild(li);
  });
  syncSelBar();
}
// ── 목록 항목 메뉴(…): 정보 수정 / 삭제 ──
function showItemMenu(btn, c){
  document.querySelectorAll('.imenu').forEach(m=>m.remove());
  const m=document.createElement('div'); m.className='imenu';
  m.innerHTML=`<button data-a="edit">정보 수정</button><button data-a="del" class="d">삭제</button>`;
  const r=btn.getBoundingClientRect(); m.style.left=(r.right-140)+'px'; m.style.top=(r.bottom+4)+'px';
  document.body.appendChild(m);
  const close=()=>{ m.remove(); document.removeEventListener('mousedown', onDown); };
  const onDown=e=>{ if (!m.contains(e.target)) close(); };
  setTimeout(()=>document.addEventListener('mousedown', onDown), 0);
  m.querySelector('[data-a="edit"]').addEventListener('click', async ()=>{ close(); await editCaseById(c.id); });
  m.querySelector('[data-a="del"]').addEventListener('click', async ()=>{ close(); if (!(await ask(`「${c.title}」 문서를 지웁니다. 되돌릴 수 없습니다.`,'지우기'))) return; await deleteMany([c.id]); });
}
async function editCaseById(id){
  if (!(await leaveOk())) return;
  const c=cases.find(x=>x.id===id); if (!c) return;

    const done=v=>{ ov.remove(); document.removeEventListener('keydown', onKey); res(v); };

// ── 슬랙식 서식: *굵게* _기울임_ __밑줄__ ~취소선~ `코드` ──
// ⟦이름|글⟧ = 다른 사람이 덧붙인 부분. 화면에선 이름표가 붙은 색 띠로, 복사 땐 [이름] 글 로
// segs=[{by,s,e}] 가 있으면 그 구간을 작성자 색 띠로 감싼다. 조각마다 따로 서식 변환하므로 띠 경계를 넘는 *굵게* 는 서식이 풀린다
function md(s, segs){
  if (segs && segs.length){
    const cuts=[...new Set(segs.flatMap(g=>[g.s,g.e]).filter(x=>x>=0 && x<=s.length))].sort((a,b)=>a-b);
    let out='', pos=0; const pts=[...cuts, s.length];
    for (const cut of pts){ if (cut<=pos) continue; const piece=s.slice(pos,cut); const g=segs.find(x=>x.s<=pos && x.e>=cut);
      if (!g){ out+=mdOne(piece); pos=cut; continue; }
      const colRaw=userColor(g.by, g.id); const col=colRaw||'var(--ins)'; const bg=/^#[0-9a-f]{6}$/i.test(colRaw) ? colRaw+'24' : 'rgba(45,91,185,.14)'; const lab=esc(userLabel(g.by, g.id)); let first=true;
      piece.split('\n').forEach((ln,i)=>{ if (i>0) out+='<br>'; if (!ln){ return; } out+=`<span class="ins-by${first?'':' cont'}" data-by="${lab}" style="--nc:${col};--nbg:${bg}">${mdOne(ln)}</span>`; first=false; });
      pos=cut; }
    return out;
  }
  return mdOne(s);
}
function mdOne(s){
  let h=esc(s);
  h=h.replace(/\[([^\]\n]{1,20})\]/g, (m0,nm)=>{ const col=userColor(nm, ''); return col ? `<span class="nm" style="--nc:${col}">[${nm}]</span>` : m0; });
  h=h.replace(/`([^`\n]+)`/g,(m0,c)=>'<code>'+c.replace(/:\/\//g,':/\u2060/')+'</code>');   // code 안 주소는 링크로 안 바뀌게 살짝 끊어 둔다(표시엔 영향 없음)
  h=h.replace(/\*([^*\n]+)\*/g,'<b>$1</b>');
  h=h.replace(/__([^_\n]+)__/g,'<u>$1</u>');
  h=h.replace(/(^|[^\w가-힣])_([^_\n]+)_(?=$|[^\w가-힣])/g,'$1<i>$2</i>');
  h=h.replace(/~([^~\n]+)~/g,'<s>$1</s>');
  h=linkify(h);
  return h.replace(/\n/g,'<br>');
}
// 자동 링크: 이미 태그 안(code 등)에 들어간 부분은 건너뛰고 글자 조각에서만 주소를 찾는다
function linkify(h){
  return h.split(/(<[^>]+>)/).map(part=>{
    if (part.startsWith('<')) return part;
    return part.replace(/(https?:\/\/)(\u200B)?([^\s<>"'`）)\]]+)/g, (m0, sch, off, rest)=> off
      ? `<span class="nolink" title="링크 해제됨 · 우클릭으로 되살리기">${sch}${rest}</span>`
      : `<a class="al" href="${sch}${rest}" target="_blank" rel="noopener noreferrer" title="새 탭에서 열기 · 우클릭으로 링크 해제">${sch}${rest}</a>`);
  }).join('');
}
// 서식이 바로 보이는 편집칸. 화면은 contenteditable, 저장은 숨은 textarea 에 슬랙 표기(*_~__`)로 동기화한다
function mdField(raw, attrs, ph, cls, segs){

}
// 편집칸의 textarea 로부터 해당 구간 목록을 찾는다(메모 이유 / 총평)
function segsFor(t){
  const c=view.draft||cases.find(x=>x.id===view.id); if (!c) return null;
  if (t.id==='noteAll') return c.noteSegs||null;
  if (t.dataset.f==='reason'){ const m=c.marks[+t.dataset.i]; return m ? (m.segs||null) : null; }

// 글이 바뀌면 구간을 따라 옮긴다. name 이 있으면(남의 메모를 고친 경우) 새로 넣은 글을 그 사람 구간으로
function updSegs(segs, oldT, newT, name, id){
  segs=(segs||[]).map(g=>({by:g.by, id:g.id||'', s:g.s, e:g.e}));
  let a=0; while (a<oldT.length && a<newT.length && oldT[a]===newT[a]) a++;
  let b=0; while (b<oldT.length-a && b<newT.length-a && oldT[oldT.length-1-b]===newT[newT.length-1-b]) b++;
  const oldLen=oldT.length-a-b, newLen=newT.length-a-b, delta=newLen-oldLen; const res=[];
  for (const g of segs){
    if (g.e<=a){ res.push(g); continue; }
    if (g.s>=a+oldLen){ res.push({by:g.by, s:g.s+delta, e:g.e+delta}); continue; }
    if (g.s<a && g.e>a+oldLen){ if (g.by===name || newLen===0) res.push({by:g.by, id:g.id, s:g.s, e:g.e+delta}); else { res.push({by:g.by, id:g.id, s:g.s, e:a}); res.push({by:g.by, id:g.id, s:a+newLen, e:g.e+delta}); } continue; }
    if (g.s<a) res.push({by:g.by, id:g.id, s:g.s, e:a});
    if (g.e>a+oldLen) res.push({by:g.by, id:g.id, s:a+newLen, e:g.e+delta});
  }
  if (newLen>0 && name){ let s0=a, e0=a+newLen; while (s0<e0 && /\s/.test(newT[s0])) s0++; while (e0>s0 && /\s/.test(newT[e0-1])) e0--; if (e0>s0) res.push({by:name, id:id||'', s:s0, e:e0}); }
  res.sort((x,y)=>x.s-y.s); const out=[];
  for (const g of res){ if (g.e<=g.s) continue; const l=out[out.length-1]; if (l && l.by===g.by && g.s<=l.e){ l.e=Math.max(l.e,g.e); } else out.push(g); }
  // 사람이 바뀐 경계에 작성자 본인 글이 끼면 그 자리만 띠가 없다(res 에 안 들어감)
  return out;
}
// HTML → 슬랙 표기
function htmlToMd(node){
  let out='';
  node.childNodes.forEach(n=>{
    if (n.nodeType===3){ out+=n.nodeValue.replace(/ /g,' '); return; }
    if (n.nodeType!==1) return;
    const tag=n.tagName.toLowerCase(); const inner=htmlToMd(n);
    const st=(n.getAttribute('style')||'').toLowerCase();
    if (tag==='br'){ out+='\n'; return; }
    if (tag==='a' && n.classList.contains('al')){ out+=n.textContent; return; }
    if (tag==='span' && n.classList.contains('nolink')){ out+=n.textContent.replace(/:\/\//,'://\u200B'); return; }
    if (tag==='code'){ out+='`'+n.textContent.replace(/\u2060/g,'')+'`'; return; }
    if (tag==='div'||tag==='p'){ out+=(out && !out.endsWith('\n') ? '\n' : '')+inner; if (tag==='p') out+='\n'; return; }
    if (!inner.trim()){ out+=inner; return; }
    if (tag==='b'||tag==='strong'||/font-weight:\s*(bold|[6-9]00)/.test(st)) out+='*'+inner+'*';
    else if (tag==='i'||tag==='em'||/font-style:\s*italic/.test(st)) out+='_'+inner+'_';

        const tvp=page.getViewport({scale, offsetX:0, offsetY:-y});
        await page.render({canvasContext: cv.getContext('2d'), viewport: tvp}).promise;
        say(`글자 인식 ${p}/${total}쪽 · ${Math.min(100, Math.round((y+h)/H*100))}%`);
        const {data}=await worker.recognize(cv, {}, {text:true, blocks:true});
        let ls=data.lines||[]; if (!ls.length && data.blocks) ls=data.blocks.flatMap(b=>(b.paragraphs||[]).flatMap(pg=>pg.lines||[]));
        const last = (y+h>=H); ls.forEach(l=>{ if (!l.bbox) return; const mid=(l.bbox.y0+l.bbox.y1)/2;
          if (y>0 && mid < OV/2) return; if (!last && mid > h-OV/2) return;   // 줄의 중점이 이 띠의 담당 구간(겹침 절반 기준)에 있을 때만 채택
          const t=(l.text||(l.words||[]).map(w=>w.text).join(' ')||'').replace(/\s+/g,' ').trim();
          if (!t || !/[가-힣A-Za-z0-9]/.test(t) || (l.confidence!=null && l.confidence<45)) return;   // 사진 속 무늬 등 쓰레기 줄 제외
          lines.push({bbox:{x0:l.bbox.x0, y0:l.bbox.y0+y, x1:l.bbox.x1, y1:l.bbox.y1+y}, t}); });
      }
      const nb=b=>[+(b.x0/W).toFixed(4), +(b.y0/H).toFixed(4), +((b.x1-b.x0)/W).toFixed(4), +((b.y1-b.y0)/H).toFixed(4)];
      out[p]=lines.map(l=>({b:nb(l.bbox), t:l.t}));
      counts.push(out[p].length); if (DEBUG) tmark('OCR '+p+'쪽 단어 '+counts[counts.length-1]+' · '+(data.text||'').trim().slice(0,40));
    }
    c.ocr=out; c.ocrAt=new Date().toISOString(); view.dirty=true;
    // 이미 그려진 쪽의 글자층을 OCR 층으로 바꿔 끼운다
    document.querySelectorAll('.page').forEach(el=>{ const p=+el.dataset.p; const tl=el.querySelector('.textLayer'); if (tl && out[p]){ const vw=el.getBoundingClientRect().width; tl.innerHTML=''; buildOcrLayer(tl, out[p], {width:vw, height:el.getBoundingClientRect().height}); } });
    toast(`글자 인식 끝. 쪽별 줄 수 ${counts.join(', ')} · 저장(Ctrl+S)하면 다른 사람도 드래그할 수 있습니다`);
    say('글자 다시 인식');
  } catch(e){ toast('글자 인식 실패: '+((e&&e.message)||e)); say('글자 인식(OCR)'); }
  finally { ocrBusy=false; if (btn) btn.disabled=false; }
}
// OCR 단어를 투명 글자로 깔아 드래그 선택이 되게 한다(줄 단위 상자 안에 단어 상자)
function buildOcrLayer(tl, lines, vp){
  tl.classList.add('ocr'); if (DEBUG) tl.classList.add('show'); const ctx=document.createElement('canvas').getContext('2d');
  lines.forEach(l=>{
    const t = l.t != null ? l.t : (l.w||[]).map(w=>w.t).join(' '); if (!t) return;
    const hpx=l.b[3]*vp.height, wpx=l.b[2]*vp.width; const fs=Math.max(6, hpx*0.8);
    const sp=document.createElement('span'); sp.className='oline'; sp.textContent=t+' ';   // 줄 끝 공백: 여러 줄을 드래그해도 글이 붙지 않게
    sp.style.left=(l.b[0]*100)+'%'; sp.style.top=(l.b[1]*100)+'%'; sp.style.fontSize=fs+'px'; sp.style.height=hpx+'px'; sp.style.lineHeight=hpx+'px';
    ctx.font=fs+'px Arial, sans-serif'; const mw=ctx.measureText(t).width||1; sp.style.transform='scaleX('+(wpx/mw).toFixed(3)+')';
    tl.appendChild(sp);
  });
}

let pdfState = null; // {c, doc, token}

const snap = c => JSON.stringify(c.marks||[]);
const HIST_MAX = 100;   // 문서당 되돌리기 깊이. 저장해도 남고, 새로고침하면 비워진다
function pushHist(c, label){ collectMarks(c); if (hist.id!==c.id) hist={id:c.id, undo:[], redo:[]}; hist.undo.push({s:snap(c), l:label||'변경', t:Date.now()}); if (hist.undo.length>HIST_MAX) hist.undo.shift(); hist.redo=[]; }
function applyHist(c, from, to){
  if (hist.id!==c.id || !from.length) return;
  collectMarks(c); const e=from.pop(); to.push({s:snap(c), l:e.l, t:Date.now()}); c.marks = JSON.parse(e.s);

}
// 실행 기록 창: 항목을 누르면 그 시점으로 한 번에 되돌아간다(되돌리기/다시 실행을 필요한 만큼 반복)
function showHistory(c){
  if (hist.id!==c.id) hist={id:c.id, undo:[], redo:[]};
  const tm=t=>new Date(t).toTimeString().slice(0,8);
  const ov=document.createElement('div'); ov.className='ask';
  const rows=[];
  hist.redo.slice().reverse().forEach((e,i)=>rows.push(`<li class="redo" data-r="${hist.redo.length-i}"><span class="k">다시</span>${esc(e.l)}<span class="t">${tm(e.t)}</span></li>`));
  rows.push(`<li class="now"><span class="k">현재</span>지금 상태 · 표시 ${fmtN(c.marks.length)}곳</li>`);
  hist.undo.slice().reverse().forEach((e,i)=>rows.push(`<li class="undo" data-u="${i+1}"><span class="k">${i+1}</span>${esc(e.l)} 이전으로<span class="t">${tm(e.t)}</span></li>`));
  ov.innerHTML=`<div class="box hist" role="dialog" aria-modal="true"><h3>실행 기록</h3><p>되돌리기 ${fmtN(hist.undo.length)} / 다시 실행 ${fmtN(hist.redo.length)} · 문서당 ${HIST_MAX}단계까지, 새로고침하면 비워집니다. 항목을 누르면 그 시점으로 갑니다.</p>
    <ul>${rows.join('')}</ul><div class="row"><button class="btn" id="histClose">닫기</button></div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('#histClose').addEventListener('click', close);
  ov.addEventListener('mousedown', e=>{ if (e.target===ov) close(); });
  ov.querySelectorAll('li.undo').forEach(li=>li.addEventListener('click', ()=>{ const n=+li.dataset.u; for (let i=0;i<n;i++) undoMarks(c); close(); toast(`${n}단계 되돌렸습니다`); }));
  ov.querySelectorAll('li.redo').forEach(li=>li.addEventListener('click', ()=>{ const n=+li.dataset.r; for (let i=0;i<n;i++) redoMarks(c); close(); toast(`${n}단계 다시 실행했습니다`); }));
}
const undoMarks = c => applyHist(c, hist.undo, hist.redo);
const redoMarks = c => applyHist(c, hist.redo, hist.undo);

function renderDocCase(main, c){
  c.marks = c.marks || [];
  if (hist.id!==c.id){ hist={id:c.id, undo:[], redo:[]}; pdfListMode=false; textRevMode=false; areaMode=false; document.body.classList.remove('area-mode'); }
  const head = document.createElement('div'); head.className='head';

    : `<div><div class="doc txtdoc ${c.type==='word'?'word':''}" id="doc"></div></div><div class="notes" id="notes"></div>`;
  main.appendChild(sheet);
  const list=document.createElement('div'); list.id='mlist'; list.hidden=true; main.appendChild(list);
  const ov=document.createElement('div'); ov.className='overall'; ov.innerHTML = overallHtml(c); main.appendChild(ov);

  else { pdfState=null; if (artifactNs) bindTextSelection($('#doc'), c); }
}

     <button class="btn small" id="undoBtn" title="Ctrl+Z${hist.undo.length?' · '+esc(hist.undo[hist.undo.length-1].l):''}" ${hist.undo.length?'':'disabled'}>↶ 되돌리기${hist.undo.length?' '+fmtN(hist.undo.length):''}</button>
     <button class="btn small" id="redoBtn" title="Ctrl+Shift+Z${hist.redo.length?' · '+esc(hist.redo[hist.redo.length-1].l):''}" ${hist.redo.length?'':'disabled'}>↷ 다시 실행${hist.redo.length?' '+fmtN(hist.redo.length):''}</button>
     <button class="btn small" id="histBtn" title="되돌리기 이력을 보고 골라서 되돌아가기" ${(hist.undo.length||hist.redo.length)?'':'disabled'}>실행 기록</button>` : ''}
     ${(isPdf(c)&&canEdit)?`<button class="btn small ${areaMode?'on':''}" id="areaBtn" title="글자 위에서도 네모로 영역을 잡고 싶을 때 켭니다. 그림 부분은 켜지 않아도 그냥 끌면 됩니다 · Alt+A">${areaMode?'영역 선택 끝':'영역 선택'}</button>`:''}
     <button class="btn small" id="copyList">메모 복사</button>${(isPdf(c)&&canEdit)?`<button class="btn small" id="ocrBtn" title="캡처본 PDF 처럼 글자층이 없는 문서의 글자를 인식해 드래그할 수 있게 합니다">${c.ocr?'글자 다시 인식':'글자 인식(OCR)'}</button>`:''}`)

  $('#toggleMarks').addEventListener('click', ()=>{ document.body.classList.toggle('hide-marks'); refreshPdfHead(c); });
  $('#modeDoc').addEventListener('click', ()=>{ pdfListMode=false; textRevMode=false; refreshPdfHead(c); });
  $('#modeList').addEventListener('click', ()=>{ collectMarks(c); pdfListMode=true; textRevMode=false; refreshPdfHead(c); });
  const mr=$('#modeRev'); if (mr) mr.addEventListener('click', ()=>{ collectMarks(c); pdfListMode=false; textRevMode=true; refreshPdfHead(c); });

  if (cb) cb.addEventListener('click', async ()=>{ if (!(await ask(`메모 ${fmtN(c.marks.length)}곳을 모두 지웁니다. 되돌리기로 복구할 수 있습니다.`,'모두 지우기'))) return; pushHist(c, `메모 모두 지우기 (${fmtN(c.marks.length)})`); c.marks=[]; view.dirty=true; drawAllMarks(c); refreshPdfHead(c); });

  if (!isPdf(c) && !pdfListMode){ if (textRevMode) renderTextRevised(c); else renderTextDoc(c); const nt=$('#notes'); if (nt) nt.hidden = textRevMode; requestAnimationFrame(fitOverall); }

}
document.addEventListener('keydown', e=>{
  if (e.key!=='Escape') return;
  const ovs=[...document.querySelectorAll('.ask:not(.lock)')]; const ov=ovs[ovs.length-1]; if (!ov) return;
  e.preventDefault(); const cancel=ov.querySelector('#pwCancel, #dpwCancel, #p2c, #uClose, #histClose, [data-v="cancel"], [data-v="0"]');
  if (cancel) cancel.click(); else ov.remove();
});
// 단축키: 입력칸 밖에서 Ctrl+Z / Ctrl+Shift+Z / Ctrl+Y
document.addEventListener('keydown', e=>{
  if (!(e.ctrlKey||e.metaKey)) return;
  const k=e.key.toLowerCase();
  if (k==='s'){ e.preventDefault(); const sb=$('#saveCase')||$('#doCompare'); if (sb && !sb.disabled && artifactNs){ if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); sb.click(); } return; }
  const tag=(e.target.tagName||'').toLowerCase();
  if (tag==='textarea'||tag==='input'||e.target.isContentEditable){
    // 메모칸에 커서가 있어도 아직 아무것도 안 적었으면(되돌릴 글자가 없으면) 표시 되돌리기로 넘긴다
    const empty = e.target.isContentEditable ? !e.target.textContent.trim() : !(e.target.value||'').trim();
    const inNote = !!e.target.closest('.note');
    if (!(inNote && empty && k==='z')) return;
    e.target.blur();
  }
  const c = view.draft || cases.find(x=>x.id===view.id); if (!c || view.mode!=='case' || !artifactNs) return;
  if (k==='z' && !e.shiftKey){ e.preventDefault(); undoMarks(c); }
  else if (k==='z' && e.shiftKey){ e.preventDefault(); redoMarks(c); }
});
function renderPdfNotes(c){
  const notes=$('#notes'); if (!notes) return;
  const canEdit = !!artifactNs;
  notes.innerHTML = `<div class="notes-title">교정 메모 ${fmtN(c.marks.length)}</div>` + c.marks.map((m,i)=>{ const h=i+1; return `
    <div class="note ${m.kind}" data-h="${h}" id="note${h}"><div class="n"><span>${h}</span><span class="chip">${KIND[m.kind]}</span>${m.by?`<span class="who" title="작성자" style="--nc:${userColor(m.by, m.byId)||'var(--ink-2)'}">${esc(userLabel(m.by, m.byId))}</span>`:''}${i===c.marks.length-1?'<span class="chip last">마지막</span>':''}<span class="k">${esc(m.text)}</span>${canEdit?`<button class="x" title="표시 지우기" data-i="${i}">×</button>`:''}</div>
    ${m.kind==='rep' ? (canEdit ? `<textarea rows="1" class="after" data-i="${i}" data-f="after" placeholder="이렇게 바꿈">${esc(m.after||'')}</textarea>` : `<div class="txt after">${esc(m.after||'')}</div>`) : ''}
    ${canEdit ? mdField(m.reason||'', `data-i="${i}" data-f="reason"`, m.kind==='memo'?'메모':'왜 고쳤는지', 'txt', m.segs) : `<div class="txt">${md(m.reason||'', m.segs)}</div>`}</div>`; }).join('');
  notes.querySelectorAll('.x').forEach(b=>b.addEventListener('click', ()=>{
    pushHist(c, `표시 ${+b.dataset.i+1} 지움`); c.marks.splice(+b.dataset.i,1); view.dirty=true; drawAllMarks(c); refreshPdfHead(c); layoutNotes();
  }));
  // 메모 글 편집도 되돌리기 대상: 칸에 들어갈 때 스냅샷을 잡고, 나올 때 바뀌었으면 확정
  notes.querySelectorAll('textarea[data-i], .fld').forEach(el=>{
    const t = el.tagName==='TEXTAREA' ? el : el.querySelector('textarea'); const f = el.tagName==='TEXTAREA' ? el : el.querySelector('.md');
    if (!t || !f || t.hidden && el.tagName==='TEXTAREA') return;
    let before=null;
    f.addEventListener('focus', ()=>{ before = t.value; });
    f.addEventListener('blur', ()=>{ if (before!==null && before.trim()!==t.value.trim()){ let cur=t.value.trim(); const bef=before.trim(); t.value=bef; pushHist(c, `메모 ${+t.dataset.i+1} 수정`);
        const m=c.marks[+t.dataset.i]; if (m && t.dataset.f==='reason'){ m.segs=updSegs(m.segs, bef, cur, (me && m.by && !sameUser(m, me)) ? me.name : null, me ? me.id : ''); m.mt=Date.now(); }
        t.value=cur; collectMarks(c); if (f.isContentEditable) f.innerHTML=md(cur, m ? m.segs : null); const ub=$('#undoBtn'); if (ub) ub.disabled=false; } before=null; });
  });
  bindNotes();
  requestAnimationFrame(()=>layoutNotes());
}
function hashStr(str){ let h=0; for (let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function markKey(m){ return 'k'+hashStr([m.kind, m.text||'', m.page||'', m.start??'', m.end??'', JSON.stringify(m.rects||[])].join('|')); }
function ensureMids(c){ (c.marks||[]).forEach(m=>{ if (!m.mid) m.mid=markKey(m); if (!m.mt) m.mt=0; }); }
const newMid=()=>'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function collectMarks(c){
  document.querySelectorAll('.note textarea[data-i]').forEach(t=>{ const m=c.marks[+t.dataset.i]; if (!m) return; const v=t.value.trim();
    if (v!==(m[t.dataset.f]||'')){ m.mt=Date.now(); if (me && m.by && !sameUser(m, me)){ m.editedBy=me.name; m.editedById=me.id; } }   // 남의 메모를 고치면 수정자 표시
    m[t.dataset.f]=v; });

async function mergeRemote(c){

  // 볼 수 있는 사람: 전체 선택/해제 + Shift+클릭 범위

  const syncType = ()=>{ $('#textPart').hidden = type!=='text'; $('#wordPart').hidden = type!=='word'; $('#pdfPart').hidden = type!=='pdf';

    t.addEventListener('dragover', e=>{ e.preventDefault(); t.classList.add('over'); });

  const takeWord = async f => {

    pb.innerHTML = clean; wordHtml = clean; wordName='(붙여넣기)'; view.dirty=true; $('#wordName').textContent=`붙여 넣은 내용 · ${fmtN(stripTags(clean).replace(/\s/g,'').length)}자`;
  });
  pb.addEventListener('input', ()=>{ if (!hasMarks){ wordHtml = sanitizeHtml(pb.innerHTML); view.dirty=true; } });
  const wz=$('#wzone');
  wz.addEventListener('dragover', e=>{ e.preventDefault(); wz.classList.add('over'); }); wz.addEventListener('dragleave', ()=>wz.classList.remove('over'));
  wz.addEventListener('drop', e=>{ e.preventDefault(); wz.classList.remove('over'); const f=e.dataTransfer.files[0]; if (f) takeWord(f); });
  $('#fWord').addEventListener('change', ()=>{ const f=$('#fWord').files[0]; if (f) takeWord(f); });
  const takePdf = async f => {
    if (!/\.pdf$/i.test(f.name)){ $('#pdfName').textContent='PDF 파일만 넣을 수 있습니다.'; return; }
    if (f.size > 8*1024*1024){ $('#pdfName').textContent='8MB를 넘는 PDF는 페이지에 담기 어렵습니다. 쪽을 줄여 주세요.'; return; }
    const buf = new Uint8Array(await f.arrayBuffer()); let bin=''; for (let i=0;i<buf.length;i+=0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i,i+0x8000));
    pdfB64 = btoa(bin); pdfName = f.name; pdfDirty = true; $('#pdfName').textContent = `${f.name} · ${fmtN(Math.round(f.size/1024))}KB`; view.dirty=true;
    if (!$('#fTitle').value.trim()) $('#fTitle').value = f.name.replace(/\.pdf$/i,'');
  };
  const zone=$('#zone');
  zone.addEventListener('dragover', e=>{ e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', ()=>zone.classList.remove('over'));
  zone.addEventListener('drop', e=>{ e.preventDefault(); zone.classList.remove('over'); const f=e.dataTransfer.files[0]; if (f) takePdf(f); });
  $('#fPdf').addEventListener('change', ()=>{ const f=$('#fPdf').files[0]; if (f) takePdf(f); });
  $('#cancelEdit').addEventListener('click', ()=>{ view = {mode: isNew?'list':'case', id:c.id, draft:null, dirty:false, show:'side'}; render(); });
  $('#doCompare').addEventListener('click', async ()=>{
    const base = {title:$('#fTitle').value.trim()||'(제목 없음)', client:$('#fClient').value.trim()};
    const lockPw=$('#fLock').value; const unlockReq = !!($('#fUnlock') && $('#fUnlock').checked);
    if (lockPw && lockPw.length<6){ $('#editMsg').textContent='문서 비밀번호는 6자 이상으로 해 주세요.'; $('#editMsg').className='msg err'; return; }
    const err=m=>{ $('#editMsg').textContent=m; $('#editMsg').className='msg err'; };
    let d; const id = c.id || ('c'+Date.now().toString(36));
    if (type==='pdf'){
      if (!pdfB64) return err('PDF 파일을 넣어 주세요.');
      d = Object.assign({}, c, base, {type:'pdf', id, pdf: pdfB64, pdfDirty, marks: c.marks||[], lockPw, unlockReq, vis:readVis()}); delete d.src; delete d.html;
    } else if (type==='word'){
      if (!wordHtml) return err('Word 파일을 넣어 주세요.');
      d = Object.assign({}, c, base, {type:'word', id, html: wordHtml, marks: (hasMarks?c.marks:[]), lockPw, unlockReq, vis:readVis()}); delete d.pdf; delete d.pages; delete d.src;
    } else {
      const src=$('#fOrig').value; if (!src.trim()) return err('원문을 넣어 주세요.');
      d = Object.assign({}, c, base, {type:'text', id, src, marks: (hasMarks?c.marks:[]), lockPw, unlockReq, vis:readVis()}); delete d.pdf; delete d.pages; delete d.html;
    }
    view = {mode:'case', id:d.id, draft:d, dirty:true, show:'side'};
    const btn=$('#doCompare'); const msgEl=$('#editMsg'); msgEl.className='msg'; msgEl.id='saveMsg';
    await saveDoc(d, btn);
  });
}
async function loadTextFile(file, target, msgEl){
  msgEl.textContent = '읽는 중…';
  try {
    let text='';
    if (/\.txt$/i.test(file.name)) text = await file.text();
    else if (/\.docx$/i.test(file.name)){
      if (!window.mammoth) await loadScript('vendor/mammoth.browser.min.js');
      const r = await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()}); text = r.value;
    } else throw new Error('DOCX, TXT만 읽습니다. PDF는 「PDF 문서」 유형으로 넣으세요.');
    text = text.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
    target.value = text; target.dispatchEvent(new Event('input'));
    msgEl.textContent = `${file.name} · ${fmtN(text.replace(/\s/g,'').length)}자`;
  } catch(e){ msgEl.textContent = '실패: ' + e.message; }
}

// ══════════════ 깃헙 저장 + 암호화 ══════════════
// 파일 배치: config.json(열쇠 봉투) · docs/index.json(목록 메타) · docs/{id}.json(메타+암호문) · docs/{id}.pdf.enc(PDF 암호문)
const GH = {owner:'Sunnyhill-K', repo:'redpen', branch:'main'};
let role=null, K=null, Kraw=null, token=null, cfg=null;
const te=new TextEncoder(), td=new TextDecoder();
function b64(u8){ let out=''; for (let i=0;i<u8.length;i+=0x8000) out+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(out); }
function ub64(str){ return Uint8Array.from(atob(str), ch=>ch.charCodeAt(0)); }
async function kek(pw, saltB64, iter){
  const km=await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:ub64(saltB64), iterations:iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encB(key, u8){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, u8)); const out=new Uint8Array(12+ct.length); out.set(iv); out.set(ct,12); return out; }
async function decB(key, u8){ u8=new Uint8Array(u8); return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:u8.slice(0,12)}, key, u8.slice(12))); }
const importK = raw => crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
let Ke=null;   // 편집자 전용키: 잠긴 문서의 열쇠를 이걸로도 싸 두어 편집자는 문서 비밀번호 없이 연다
async function deriveKe(kraw, tok){
  const km=await crypto.subtle.importKey('raw', kraw, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF', hash:'SHA-256', salt:te.encode(tok), info:te.encode('redpen-editor-key')}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
const docKeys = {};   // id → CryptoKey (이 페이지 안에서만 기억)
function askPw(title){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='ask';
    ov.innerHTML=`<form class="box" role="dialog" aria-modal="true"><h3>🔒 ${esc(title)}</h3><p>이 문서는 비밀번호가 따로 걸려 있습니다.</p>
      <input type="password" id="dpw" autocomplete="off" placeholder="문서 비밀번호"><div class="msg err" id="dpwErr"></div>
      <div class="row"><button class="btn" type="button" id="dpwCancel">취소</button><button class="btn primary" type="submit">열기</button></div></form>`;
    document.body.appendChild(ov); ov.querySelector('#dpw').focus();
    ov.querySelector('#dpwCancel').addEventListener('click', ()=>{ ov.remove(); res(null); });
    ov.querySelector('form').addEventListener('submit', e=>{ e.preventDefault(); const v=ov.querySelector('#dpw').value; ov.remove(); res(v); });
  });
}
// 잠긴 문서의 열쇠 얻기: 편집자는 Ke 로, 뷰어는 문서 비밀번호로
async function docKey(c, d){
  if (docKeys[c.id]) return docKeys[c.id];
  if (Ke && d.wrap && d.wrap.ed){ try { const kr=await decB(Ke, ub64(d.wrap.ed)); c._kdRaw=kr; return (docKeys[c.id]=await importK(kr)); } catch(_){} }
  for (;;){
    const pw=await askPw(c.title||''); if (pw===null) return null;
    try { const kk=await kek(pw, d.wrap.pw.salt, cfg.iter); const kr=await decB(kk, ub64(d.wrap.pw.k)); c._kdRaw=kr; return (docKeys[c.id]=await importK(kr)); }
    catch(_){ toast('문서 비밀번호가 맞지 않습니다.'); }
  }
}

// ── 깃헙 읽기/쓰기. 편집자(토큰 있음)는 API 로 최신본, 뷰어는 raw CDN(몇 분 캐시) ──
const apiUrl = path => `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`;
const rawUrl = path => `https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${GH.branch}/${path}?v=${Date.now()}`;
const authH = extra => Object.assign({Authorization:'Bearer '+token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}, extra||{});
async function ghRead(path){
  if (token){
    const r=await fetch(apiUrl(path)+`?ref=${GH.branch}&v=${Date.now()}`, {headers:authH({Accept:'application/vnd.github.raw+json'}), cache:'no-store'});
    if (r.status===404) return null; if (!r.ok) throw new Error('깃헙 읽기 실패 '+r.status); return new Uint8Array(await r.arrayBuffer());
  }
  const r=await fetch(rawUrl(path), {cache:'no-store'});
  if (r.status===404) return null; if (!r.ok) throw new Error('읽기 실패 '+r.status); return new Uint8Array(await r.arrayBuffer());
}
async function ghSha(path){
  const cut=path.lastIndexOf('/'); const dir=cut>=0?path.slice(0,cut):''; const name=path.slice(cut+1);
  const r=await fetch(apiUrl(dir)+`?ref=${GH.branch}&v=${Date.now()}`, {headers:authH(), cache:'no-store'});
  if (r.status===404) return null; if (!r.ok) throw new Error('깃헙 목록 실패 '+r.status);
  const arr=await r.json(); const f=(Array.isArray(arr)?arr:[]).find(x=>x.name===name); return f?f.sha:null;
}
async function ghWrite(path, u8, message){
  for (let attempt=0; attempt<2; attempt++){
    const sha=await ghSha(path);
    const r=await fetch(apiUrl(path), {method:'PUT', headers:authH({'Content-Type':'application/json'}), body: JSON.stringify(Object.assign({message, content:b64(u8), branch:GH.branch}, sha?{sha}:{}))});
    if (r.ok) return;
    if ((r.status===409||r.status===422) && attempt===0) continue;
    throw new Error('깃헙 쓰기 실패 '+r.status+' '+(await r.text()).slice(0,160));
  }
}
async function ghDelete(path, message){
  const sha=await ghSha(path); if (!sha) return;
  const r=await fetch(apiUrl(path), {method:'DELETE', headers:authH({'Content-Type':'application/json'}), body: JSON.stringify({message, sha, branch:GH.branch})});
  if (!r.ok && r.status!==404) throw new Error('깃헙 삭제 실패 '+r.status);
}

// ── 목록/문서 ──
async function loadIndex(){ const u=await ghRead('docs/index.json'); cases = u ? JSON.parse(td.decode(u)) : []; cases.forEach(c=>{ c.loaded=false; }); }
async function loadDoc(c){
  if (!K) throw new Error('먼저 비밀번호로 열어 주세요');
  tmark('문서 열기 시작'); const u=await ghRead(`docs/${c.id}.json`); if (!u) throw new Error('문서 파일이 없습니다'); tmark('문서 파일 받음');
  const d=JSON.parse(td.decode(u));
  let key=K;
  if (d.lock){ key=await docKey(c, d); if (!key) throw new Error('문서 비밀번호가 필요합니다'); c.lock=true; c._wrap=d.wrap; } else { c.lock=false; }
  const payload=JSON.parse(td.decode(await decB(key, ub64(d.ct))));
  Object.assign(c, {title:d.title, date:d.date, ts:d.ts||'', type:d.type||'text', client:d.client, vis:(Array.isArray(d.vis)?d.vis:null), owner:d.owner||''}, payload);
  if (isPdf(c)){ const pe=await ghRead(`docs/${c.id}.pdf.enc`); if (!pe) throw new Error('PDF 파일이 없습니다'); tmark('PDF 파일 받음'); c.pdf=b64(await decB(key, pe)); tmark('PDF 복호화'); }

async function readConfigFresh(){

}

async function tryUnlock(pw){
  const key=await kek(pw, cfg.salt, cfg.iter);
  let kr=null, t=null;
  try { kr=await decB(key, ub64(cfg.editor.k)); t=td.decode(await decB(key, ub64(cfg.editor.t))); } catch(_){ kr=null; }
  if (kr){
    Kraw=kr; K=await importK(kr); token=t; role='editor';
    try { const fresh=await readConfigFresh(); if (fresh && fresh.editor) cfg=fresh; } catch(_){}
    try {
      if (cfg.editor.s){ esec=td.decode(await decB(key, ub64(cfg.editor.s))); Ke=await deriveKe(kr, esec); }
      else await migrateEditorSecret(key, kr, t);
    } catch(ex){ Ke=await deriveKe(kr, t); esec=null; setTimeout(()=>toast('편집자 열쇠 정리에 실패했습니다: '+((ex&&ex.message)||ex)+' · 잠긴 문서 기능만 영향'), 500); }
    return true;
  }
  try { const kr=await decB(key, ub64(cfg.viewer.k)); Kraw=kr; K=await importK(kr); token=null; role='viewer'; return true; } catch(_){}
  return false;
}
// 옛 구조(Ke 를 토큰에서 파생) → 새 구조(editor.s). 잠긴 문서의 편집자 봉투를 새 Ke 로 다시 싸고 config 에 s 를 넣는다
async function migrateEditorSecret(key, kr, t){

    try { const kd=await decB(KeOld, ub64(d.wrap.ed)); d.wrap.ed=b64(await encB(KeNew, kd)); await ghWrite(`docs/${m.id}.json`, te.encode(JSON.stringify(d)), `rekey: ${d.title}`); } catch(_){} }
  const c2=JSON.parse(JSON.stringify(cfg)); c2.editor.s=b64(await encB(key, te.encode(sNew)));
  await ghWrite('config.json', te.encode(JSON.stringify(c2)), 'editor secret'); cfg=c2; esec=sNew; Ke=KeNew;
}

      try { await decB(key, ub64(u.k)); } catch(_){ throw new Error('현재 비밀번호가 맞지 않습니다'); }
      const c2=JSON.parse(JSON.stringify(cfg));
      if (nw){ const env=await makeUserEnvelope(nw, me.role); Object.assign(c2.users.find(x=>x.id===me.id), env); }
      let newTok=token;
      if (nt){
        const r=await fetch(apiUrl('config.json')+`?ref=${GH.branch}&v=${Date.now()}`, {headers:{Authorization:'Bearer '+nt, Accept:'application/vnd.github+json'}, cache:'no-store'});
        if (!r.ok) throw new Error('새 토큰으로 저장소를 읽지 못했습니다 ('+r.status+'). 저장소·권한(Contents: Read and write)을 확인하세요');
        newTok=nt; c2.tok=b64(await encB(Ke, te.encode(newTok)));
      }
      const oldTok=token; token=newTok;
      try { await ghWrite('config.json', te.encode(JSON.stringify(c2)), nt?'token rotated':'password'); } catch(ex){ token=oldTok; throw ex; }
      cfg=c2; saveSess(!!localStorage.getItem('redpen.sess')); ov.remove();
      toast(nt ? '토큰을 갱신했습니다. 깃헙에서 옛 토큰을 삭제하세요.' : '비밀번호를 바꿨습니다');
    } catch(ex){ err.textContent=(ex&&ex.message)||String(ex); }
  });
}
// ── 사용자 관리(관리자): ID · 이름 · 권한 · 비밀번호 재설정 · 삭제 ──
async function manageUsers(){
  const ov=document.createElement('div'); ov.className='ask';
  const ROLE={admin:'관리자', editor:'편집자', viewer:'뷰어'};
  const PAL=['#C4342D','#2D5BB9','#2E7D4F','#B0620D','#7A3E9D','#0E7C86','#8A6D1E','#C2185B','#3F51B5','#00796B','#5D4037','#E64A19'];
  // 새 계정 기본 색 = 아직 아무도 안 쓰는 색. 다 쓰였으면 색상환에서 비어 있는 각도를 고른다
  const freeColor=()=>{ const used=new Set(cfg.users.map(u=>(u.color||'').toLowerCase())); const f=PAL.find(c=>!used.has(c.toLowerCase())); if (f) return f;
    const h=Math.round((cfg.users.length*137.5)%360); const k=n=>{ const a=(n+h/30)%12, c2=0.55*Math.min(0.45,1-0.45); const v=0.45-c2*Math.max(-1,Math.min(a-3,9-a,1)); return Math.round(v*255).toString(16).padStart(2,'0'); }; return '#'+k(0)+k(8)+k(4); };
  const draw=()=>{
    ov.innerHTML=`<div class="box users" role="dialog" aria-modal="true"><h3>사용자 관리</h3>
      <table><thead><tr><th>ID</th><th>이름</th><th>색</th><th>권한</th><th></th></tr></thead><tbody>${cfg.users.map((u,ui)=>`
        <tr data-id="${esc(u.id)}"><td class="mono">${esc(u.id)}</td><td><input class="nm" value="${esc(u.name)}"></td><td><input type="color" class="cl" value="${esc(u.color||PAL[ui%PAL.length])}" title="이름 색"></td>
        <td><select class="rl">${Object.keys(ROLE).map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${ROLE[r]}</option>`).join('')}</select></td>
        <td class="acts"><button class="btn small" data-a="pw">비번 재설정</button>${u.id===me.id?'':`<button class="btn small danger" data-a="del">삭제</button>`}</td></tr>`).join('')}</tbody></table>
      <h4>새 계정</h4>
      <div class="newrow"><input id="nId" placeholder="ID (영문·숫자)"><input id="nName" placeholder="이름"><input type="color" id="nColor" value="${freeColor()}" title="이름 색 (안 쓰인 색을 골라 둠)"><select id="nRole"><option value="viewer">뷰어</option><option value="editor">편집자</option><option value="admin">관리자</option></select><input id="nPw" type="password" placeholder="초기 비밀번호 (8자+)" autocomplete="new-password"><button class="btn small primary" id="nAdd">추가</button></div>
      <div class="msg err" id="uErr"></div>
      <div class="row"><button class="btn" id="uClose">닫기</button><button class="btn primary" id="uSave">이름·권한 저장</button></div></div>`;
    const err=ov.querySelector('#uErr');
    ov.querySelector('#uClose').addEventListener('click', ()=>ov.remove());
    ov.querySelector('#uSave').addEventListener('click', async ()=>{
      try { const c2=JSON.parse(JSON.stringify(cfg));
        ov.querySelectorAll('tbody tr').forEach(tr=>{ const u=c2.users.find(x=>x.id===tr.dataset.id); if (!u) return; u.name=tr.querySelector('.nm').value.trim()||u.name; u.color=tr.querySelector('.cl').value; const r=tr.querySelector('.rl').value; if (r!==u.role){ if (u.role==='viewer' && r!=='viewer') throw new Error(`${u.id}: 뷰어를 편집자로 올리려면 비밀번호 재설정으로 새 봉투를 만들어야 합니다(같은 줄의 「비번 재설정」에서 권한과 함께 처리됩니다)`); u.role=r; if (r==='viewer') delete u.s; } });
        if (!c2.users.some(u=>u.role==='admin')) throw new Error('관리자가 최소 한 명은 있어야 합니다');
        await ghWrite('config.json', te.encode(JSON.stringify(c2)), 'users'); cfg=c2; if (me){ const mu=cfg.users.find(x=>x.id===me.id); if (mu){ me.name=mu.name; me.role=mu.role; saveSess(!!localStorage.getItem('redpen.sess')); applyRole(); } }
        toast('저장했습니다'); draw();
      } catch(ex){ err.textContent=(ex&&ex.message)||String(ex); }
    });
    ov.querySelector('#nAdd').addEventListener('click', async ()=>{
      try { const id=ov.querySelector('#nId').value.trim(), name=ov.querySelector('#nName').value.trim(), r=ov.querySelector('#nRole').value, pw=ov.querySelector('#nPw').value;
        if (!/^[A-Za-z0-9_.-]{2,32}$/.test(id)) throw new Error('ID 는 영문·숫자 2-32자로.'); if (!name) throw new Error('이름을 넣어 주세요.'); if (pw.length<8) throw new Error('초기 비밀번호는 8자 이상으로.');
        if (cfg.users.some(u=>u.id.toLowerCase()===id.toLowerCase())) throw new Error('이미 있는 ID 입니다.');
        const env=await makeUserEnvelope(pw, r); const c2=JSON.parse(JSON.stringify(cfg)); c2.users.push(Object.assign({id, name, role:r, color:ov.querySelector('#nColor').value}, env));
        await ghWrite('config.json', te.encode(JSON.stringify(c2)), 'user add: '+id); cfg=c2; toast(`${name}(${id}) 계정을 만들었습니다. ID 와 초기 비밀번호를 전해 주세요.`); draw();
      } catch(ex){ err.textContent=(ex&&ex.message)||String(ex); }
    });
    ov.querySelectorAll('[data-a="pw"]').forEach(b=>b.addEventListener('click', async ()=>{
      const tr=b.closest('tr'); const id=tr.dataset.id; const r=tr.querySelector('.rl').value;
      const pw=await askPw2(`${id} 의 새 비밀번호 (8자 이상)`); if (pw===null) return; if (pw.length<8){ err.textContent='8자 이상으로.'; return; }
      try { const env=await makeUserEnvelope(pw, r); const c2=JSON.parse(JSON.stringify(cfg)); const u=c2.users.find(x=>x.id===id); Object.assign(u, env, {role:r}); if (r==='viewer') delete u.s;
        await ghWrite('config.json', te.encode(JSON.stringify(c2)), 'user pw: '+id); cfg=c2; toast(`${id} 비밀번호를 재설정했습니다`); draw();
      } catch(ex){ err.textContent=(ex&&ex.message)||String(ex); }
    }));
    ov.querySelectorAll('[data-a="del"]').forEach(b=>b.addEventListener('click', async ()=>{
      const id=b.closest('tr').dataset.id; if (!(await ask(`${id} 계정을 지웁니다.`,'지우기'))) return;
      try { const c2=JSON.parse(JSON.stringify(cfg)); c2.users=c2.users.filter(u=>u.id!==id); if (!c2.users.some(u=>u.role==='admin')) throw new Error('관리자가 최소 한 명은 있어야 합니다');
        await ghWrite('config.json', te.encode(JSON.stringify(c2)), 'user del: '+id); cfg=c2; toast('지웠습니다'); draw();
      } catch(ex){ err.textContent=(ex&&ex.message)||String(ex); }
    }));
  };
  draw(); document.body.appendChild(ov);
}
function askPw2(label){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='ask';
    ov.innerHTML=`<form class="box" role="dialog" aria-modal="true"><p>${esc(label)}</p><input type="password" id="p2" autocomplete="new-password"><div class="row"><button class="btn" type="button" id="p2c">취소</button><button class="btn primary" type="submit">확인</button></div></form>`;
    document.body.appendChild(ov); ov.querySelector('#p2').focus();
    ov.querySelector('#p2c').addEventListener('click', ()=>{ ov.remove(); res(null); });
    ov.querySelector('form').addEventListener('submit', e=>{ e.preventDefault(); const v=ov.querySelector('#p2').value; ov.remove(); res(v); });
  });
}
function applyRole(){
  artifactNs = role==='editor' ? {} : null;
  $('#btnSel').hidden = !artifactNs;
  $('#btnNew').hidden = !artifactNs; $('#btnPw').hidden = !me;
  $('#btnUsers').hidden = !(me && me.role==='admin');
  $('#whoami').textContent = me ? `${me.name} · ${({admin:'관리자', editor:'편집자', viewer:'뷰어'})[me.role]||''}` : (role==='editor' ? '편집자' : '뷰어');
  const col=me?userColor(me.name, me.id):''; $('#whoami').style.cssText = col ? `color:${col};border:1px solid ${col};background:transparent` : '';
}
async function boot(){
  tmark('시작'); try { await loadConfig(); tmark('설정 읽음'); } catch(e){ $('#main').innerHTML=`<div class="head"><p class="msg err">설정 파일을 읽지 못했습니다: ${esc((e&&e.message)||e)}</p></div>`; return; }
  let sess=null; try { sess=JSON.parse(sessionStorage.getItem('redpen.sess')||localStorage.getItem('redpen.sess')||'null'); } catch(e){}
  let spot=null;
  if (sess && sess.role && sess.k && sess.me){ role=sess.role; token=sess.t||null; Kraw=ub64(sess.k); K=await importK(Kraw); esec=sess.s||null; me=sess.me;
    if (token && esec) Ke=await deriveKe(Kraw, esec); else if (token){ try { sessionStorage.removeItem('redpen.sess'); localStorage.removeItem('redpen.sess'); } catch(e){} sess=null; }
    try { spot=JSON.parse(sessionStorage.getItem('redpen.spot')||'null'); } catch(e){} }
  if (!(sess && sess.role && sess.k && sess.me)){ await lockScreen(); try { sessionStorage.removeItem('redpen.spot'); } catch(e){} }
  applyRole();
  tmark('로그인 상태 확인'); try { await loadIndex(); tmark('목록 읽음'); } catch(e){ toast('목록을 읽지 못했습니다: '+((e&&e.message)||e)); }
  const m=location.hash.match(/case=([\w-]+)/);
  if (m && cases.some(c=>c.id===m[1] && canSee(c))) view={mode:'case', id:m[1], draft:null, dirty:false, show:'side'};
  if (spot && view.mode==='case' && spot.id===view.id){ lastNoteFocus=spot.f||null; pendingSpot={y:spot.y||0}; }   // 새로고침: 마지막 자리로
  tmark('화면 그리기 시작'); render(); tmark('화면 그리기 끝');
}

// ── 링크 우클릭 메뉴 ──
function showLinkMenu(x, y, items){
  document.querySelectorAll('.imenu').forEach(m=>m.remove());
  const m=document.createElement('div'); m.className='imenu'; m.style.left=Math.min(x, window.innerWidth-160)+'px'; m.style.top=y+'px';
  items.forEach(it=>{ const b=document.createElement('button'); b.textContent=it.l; b.addEventListener('mousedown', e=>{ e.preventDefault(); e.stopPropagation(); }); b.addEventListener('click', ()=>{ close(); it.f(); }); m.appendChild(b); });
  const close=()=>{ m.remove(); document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
  const onDown=e=>{ if (!m.contains(e.target)) close(); }; const onKey=e=>{ if (e.key==='Escape') close(); };
  setTimeout(()=>{ document.addEventListener('mousedown', onDown); document.addEventListener('keydown', onKey); }, 0);
  document.body.appendChild(m);
}
// ══════════════ 공통 ══════════════
// 샌드박스 iframe에서는 브라우저 확인창이 열리지 않고 곧장 취소로 떨어지므로 자체 확인창을 쓴다
function ask(msg, okLabel){
  return new Promise(res=>{
    const ov=document.createElement('div'); ov.className='ask';
    ov.innerHTML=`<div class="box" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="row"><button class="btn" data-v="0">취소</button><button class="btn primary" data-v="1">${esc(okLabel||'확인')}</button></div></div>`;
    const done=v=>{ ov.remove(); document.removeEventListener('keydown', onKey); res(v); };
    const onKey=e=>{ if (e.key==='Escape') done(false); if (e.key==='Enter') done(true); };
    ov.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>done(b.dataset.v==='1')));
    ov.addEventListener('mousedown', e=>{ if (e.target===ov) done(false); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov); ov.querySelector('.primary').focus();
  });
}
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'), 2200); }
async function copyText(t, ok){
  try { await navigator.clipboard.writeText(t); toast(ok); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(ok);}catch(_){ toast('복사가 막혀 있습니다. 직접 선택해 복사해 주세요.'); } ta.remove(); }
}

  requestAnimationFrame(()=>{ layoutNotes(); if (pdfState && $('#doc')) drawPages(); }); });

document.fonts && document.fonts.ready.then(()=>layoutNotes());

$('#btnLock').addEventListener('click', lockNow);
// 화면 글자 크기(문서 제외)
var uiScale=1; try { uiScale=parseFloat(localStorage.getItem('redpen.ui'))||1; } catch(e){}
function applyUi(){ document.documentElement.style.setProperty('--ui', uiScale); $('#uiReset').textContent=Math.round(uiScale*100)+'%'; try { localStorage.setItem('redpen.ui', uiScale); } catch(e){} syncTop(); layoutNotes(); fitOverall(); if (pdfState && $('#doc')) drawPages(); else layoutTextDoc(); }

$('#uiMinus').addEventListener('click', ()=>setUi(-0.1)); $('#uiPlus').addEventListener('click', ()=>setUi(0.1)); $('#uiReset').addEventListener('click', ()=>setUi(0,true));
document.documentElement.style.setProperty('--ui', uiScale); $('#uiReset').textContent=Math.round(uiScale*100)+'%';

$('#brand').addEventListener('click', ()=>$('#btnList').click());
$('#brand').addEventListener('keydown', e=>{ if (e.key==='Enter') $('#btnList').click(); });
$('#btnSel').addEventListener('click', ()=>{ selMode=!selMode; lastSel=-1; if (!selMode) selIds.clear(); renderList(); });
$('#selAll').addEventListener('click', ()=>{ if (selIds.size===cases.length) selIds.clear(); else cases.forEach(c=>selIds.add(c.id)); renderList(); });
$('#selDel').addEventListener('click', async ()=>{ const ids=[...selIds]; if (!ids.length) return;
  if (!(await ask(`선택한 ${fmtN(ids.length)}건을 지웁니다. 되돌릴 수 없습니다.`,'모두 지우기'))) return; selMode=false; await deleteMany(ids); });
$('#btnPw').addEventListener('click', changePasswords);

$('#btnNew').hidden = true; $('#btnPw').hidden = true;
render();
boot();
})();
